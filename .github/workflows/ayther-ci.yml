name: AYTHER CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ayther-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_MINGW_VERSION: "20260519"
  LLVM_MINGW_SHA256: "2fa481d30909cbdcf740c6dce11a3f1e72224070cde76c0683289f0bb44f4dd9"

jobs:
  source-quality:
    name: Source quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # El gate vale para el codigo QUE ESCRIBIMOS NOSOTROS. Upstream commitea
      # con trailing whitespace, asi que un `diff --check` acumulado sobre el
      # rango entero rebotaba TODO PR de sync: no por algo que hicimos mal, sino
      # porque el rango incluye las lineas de upstream. Y el arreglo tentador
      # -limpiar esas lineas- diverge de upstream justo donde mas duele: cada
      # vez que upstream las vuelva a tocar, conflicto, para siempre y a cambio
      # de nada.
      #
      # Por eso se revisa COMMIT POR COMMIT y se saltean los que ya viven en
      # upstream/master. Los nuestros se siguen revisando enteros, incluidos los
      # de un PR que ademas trae un sync: el #46 trajo 24 commits de upstream y
      # uno nuestro, y el nuestro tiene que pasar igual.
      - name: Check whitespace in changed lines
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          UPSTREAM_URL: https://github.com/libretro/Genesis-Plus-GX.git
        run: |
          set -euo pipefail
          git remote get-url upstream >/dev/null 2>&1 || git remote add upstream "$UPSTREAM_URL"
          # Si el fetch falla NO se saltea nada: se revisa todo y el job se pone
          # rojo. Fallar cerrado es lo correcto; un fetch caido que apagara el
          # gate en silencio es exactamente el modo de falla que no queremos.
          git fetch --no-tags --quiet upstream master || echo "AVISO: fetch de upstream fallo; no se saltea ningun commit." >&2
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$BASE_SHA..HEAD"
          else
            range="HEAD~1..HEAD"
          fi
          status=0
          for commit in $(git rev-list --no-merges "$range"); do
            if git merge-base --is-ancestor "$commit" upstream/master 2>/dev/null; then
              continue
            fi
            parent=$(git rev-parse -q --verify "$commit^") || continue
            # Un cambio de fin de linea reescribe TODAS las lineas del archivo,
            # asi que `--check` las ve como agregadas y aflora el trailing
            # whitespace que YA ESTABA. Ese whitespace no lo introdujo este
            # commit: cambiar el EOL no toca los espacios. Por eso se revisan
            # solo los archivos cuyo CONTENIDO cambio, y no el commit entero.
            # --numstat con --ignore-cr-at-eol es lo que sabe la diferencia;
            # --name-only NO sirve, lista igual los archivos EOL-only.
            mapfile -t paths < <(git -c core.quotePath=false diff --numstat --ignore-cr-at-eol --no-renames "$parent" "$commit" | awk -F'	' '$1 != "-" && $1 + $2 > 0 { print $3 }')
            [ "${#paths[@]}" -gt 0 ] || continue
            git -c core.whitespace=cr-at-eol show --check --format=fuller --no-renames "$commit" -- "${paths[@]}" || status=1
          done
          exit "$status"

      # Un flip de fin de linea reescribe el archivo entero y NO lo atrapa el
      # gate de whitespace, que solo mira espacios. Paso de verdad: el commit
      # del hook de ym3438.c figuraba con 2886 lineas cambiadas para un cambio
      # de 12, y volvio a divergir de upstream justo despues de que bajaramos
      # la divergencia de 170 archivos a 27. Peor: un flip JUNTO CON un cambio
      # de contenido tambien rompe el gate de whitespace, porque el archivo
      # entero pasa a contar como lineas agregadas y aflora el trailing
      # whitespace preexistente de upstream.
      #
      # El invariante se mide contra UPSTREAM, no contra el commit anterior.
      # Comparar con el commit anterior no distingue alejarse de upstream
      # -- que es el defecto-- de volver -- que es la reparacion--, y termina
      # bloqueando justo al que viene a arreglarlo.
      - name: EOL style must match upstream
        shell: bash
        env:
          UPSTREAM_URL: https://github.com/libretro/Genesis-Plus-GX.git
        run: |
          set -euo pipefail
          git remote get-url upstream >/dev/null 2>&1 || git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags --quiet upstream master || {
            echo "AVISO: fetch de upstream fallo; no se puede comparar." >&2; exit 0; }
          # #43: la regla vive en tests/ci/check_eol.sh para poder correrla ANTES
          # de pushear, y barre todo lo que difiere de upstream en vez de solo los
          # archivos que toco este PR.
          bash tests/ci/check_eol.sh

      - name: Enforce LF in AYTHER automation and fixtures
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --eol .github/workflows tests bench | grep -E 'w/(crlf|mixed)'; then
            echo "AYTHER CI, test and benchmark files must use LF line endings." >&2
            exit 1
          fi

      # #28: los gates de capa viven DENTRO de cada renderer Mode 5, y hay
      # cinco. Cuando se agregaron, tres se quedaron sin ellos y el sintoma fue
      # el peor posible: escribir la mascara no hacia nada, sin error ni motivo
      # de fallback. Un test de pixeles necesita una escena por modo (#35);
      # esto ataca la reincidencia, que es un renderer NUEVO sin gates.
      - name: Every Mode 5 renderer consults the layer gates
        run: bash tests/ci/check_render_gates.sh

  linux-core:
    name: Linux core (${{ matrix.compiler }}, extensions=${{ matrix.ayther_extensions }}, probe=${{ matrix.sound_probe }}, legacy=${{ matrix.legacy_profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
            ayther_extensions: 0
            sound_probe: 0
            legacy_profile: 0
          - compiler: gcc
            cc: gcc
            cxx: g++
            ayther_extensions: 1
            sound_probe: 0
            legacy_profile: 0
          - compiler: gcc
            cc: gcc
            cxx: g++
            ayther_extensions: 1
            sound_probe: 1
            legacy_profile: 0
          - compiler: clang
            cc: clang
            cxx: clang++
            ayther_extensions: 1
            sound_probe: 1
            legacy_profile: 0
          - compiler: gcc
            cc: gcc
            cxx: g++
            ayther_extensions: 1
            sound_probe: 1
            legacy_profile: 1
          # #33: HOOK_CPU nunca se compilaba en CI, y por eso llevaba tiempo
          # roto: cpuhook.h definia `cpu_hook` en vez de declararlo, lo cual
          # solo linkeaba con -fcommon (default hasta gcc 9 / clang 10).
          - compiler: clang
            cc: clang
            cxx: clang++
            ayther_extensions: 1
            sound_probe: 1
            legacy_profile: 0
            hook_cpu: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build libretro core
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >-
          make -f Makefile.libretro platform=unix
          AYTHER_EXTENSIONS=${{ matrix.ayther_extensions }}
          AYTHER_LEGACY_PROFILE=${{ matrix.legacy_profile }}
          SOUND_PROBE=${{ matrix.sound_probe }}
          HOOK_CPU=${{ matrix.hook_cpu || 0 }} -j2

      - name: Verify shared-library exports
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          AYTHER_EXTENSIONS: ${{ matrix.ayther_extensions }}
          LEGACY_PROFILE: ${{ matrix.legacy_profile }}
          SOUND_PROBE: ${{ matrix.sound_probe }}
        run: |
          set -euo pipefail
          mkdir -p ayther-artifacts
          nm -D --defined-only genesis_plus_gx_libretro.so > ayther-artifacts/exports.txt
          grep -Eq '[[:space:]]retro_init$' ayther-artifacts/exports.txt
          grep -Eq '[[:space:]]retro_run$' ayther-artifacts/exports.txt
          # #32: el closure lo decide tests/ci/check_exports.sh contra
          # allowed_exports.txt, la MISMA lista que usa el job de Windows.
          # Cuando la regla estaba escrita aca y en el .ps1, divergieron sin que
          # nada lo notara: cada job solo corre en su plataforma.
          awk '{print $NF}' ayther-artifacts/exports.txt | sort -u > ayther-artifacts/export_names.txt
          bash tests/ci/check_exports.sh ayther-artifacts/export_names.txt "$AYTHER_EXTENSIONS" "$LEGACY_PROFILE" "$SOUND_PROBE" | tee ayther-artifacts/export_closure.txt
          if [[ "$AYTHER_EXTENSIONS" != "1" ]]; then
            # Sin extensiones no puede quedar ni la implementacion interna.
            nm --defined-only genesis_plus_gx_libretro.so > ayther-artifacts/symbols.txt
            if grep -Eq '[[:space:]](ayther_|audio_probe_)' ayther-artifacts/symbols.txt; then
              echo "AYTHER implementation leaked from extensions-off build" >&2
              exit 1
            fi
          fi
          "$CC" -O2 -Wall -Wextra -o ayther-artifacts/load_core tests/ci/load_core.c -ldl
          # Lo que tiene que RESOLVER dinamicamente sale de la misma lista, para
          # no volver a mantener dos copias de la superficie publica.
          required=(retro_init retro_run)
          for symbol in $(sed -n 's/^export closure OK ([^)]*): //p' ayther-artifacts/export_closure.txt); do
            required+=("$symbol")
          done
          ayther-artifacts/load_core "$(pwd)/genesis_plus_gx_libretro.so" "${required[@]}"
          "$CC" -O2 -Wall -Wextra -Icore -o ayther-artifacts/verify_ayther_api \
            tests/ci/verify_ayther_api.c -ldl
          if [[ "$AYTHER_EXTENSIONS" == "1" ]]; then
            abi_args=("$(pwd)/genesis_plus_gx_libretro.so" --require)
            if [[ "$LEGACY_PROFILE" == "1" ]]; then
              abi_args+=(--legacy)
            fi
            ayther-artifacts/verify_ayther_api "${abi_args[@]}"
          else
            ayther-artifacts/verify_ayther_api \
              "$(pwd)/genesis_plus_gx_libretro.so"
          fi
          # #33: un cliente compilado contra 1.0, que no conoce 1.1 ni 1.2.
          # Congelar offsets contra el header actual detecta un reordenamiento
          # pero no contesta si un frontend ya compilado sigue funcionando.
          if [[ "$AYTHER_EXTENSIONS" == "1" ]]; then
            "$CC" -O2 -Wall -Wextra -o ayther-artifacts/abi_compat_1_0 tests/ci/abi_compat_1_0.c -ldl
            ayther-artifacts/abi_compat_1_0 "$(pwd)/genesis_plus_gx_libretro.so"
          fi
          "$CC" -shared -fPIC -o ayther-artifacts/mock_stock_core.so \
            tests/ci/mock_stock_core.c
          ayther-artifacts/verify_ayther_api \
            "$(pwd)/ayther-artifacts/mock_stock_core.so"

      - name: Preserve export diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: linux-exports-${{ matrix.compiler }}-extensions-${{ matrix.ayther_extensions }}-probe-${{ matrix.sound_probe }}-legacy-${{ matrix.legacy_profile }}
          path: ayther-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  deterministic-tests:
    name: Full-core determinism and performance (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run unit and golden-trace tests
        run: make -C tests check CC=clang

      - name: Build extensions-off performance reference
        env:
          CC: clang
          CXX: clang++
        run: |
          make -B -f Makefile.libretro platform=unix AYTHER_EXTENSIONS=0 SOUND_PROBE=0 -j2
          mkdir -p tests/artifacts/profiles
          cp genesis_plus_gx_libretro.so tests/artifacts/profiles/extensions-off.so

      - name: Build telemetry-enabled core for deterministic replay
        env:
          CC: clang
          CXX: clang++
        run: >-
          make -B -f Makefile.libretro platform=unix
          AYTHER_EXTENSIONS=1 SOUND_PROBE=1 -j2

      - name: Preserve compiled-idle performance candidate
        run: cp genesis_plus_gx_libretro.so tests/artifacts/profiles/compiled-idle.so

      - name: Replay generated ROM across save/load boundary
        run: >-
          make -C tests check-full-core
          CC=clang
          CORE=../genesis_plus_gx_libretro.so

      - name: Reject a savestate written by a different ABI
        run: >-
          make -C tests check-state-guard
          CC=clang
          CORE=../genesis_plus_gx_libretro.so

      # #45: los tamanios quedan en el log de las DOS plataformas; comparar la
      # divergencia de state_hash pasa a ser leer dos corridas.
      - name: Report serialized struct layout
        run: make -C tests state-layout CC=clang

      # #29: que la mascara de mute llegue a los DOS cores de FM.
      - name: Audio controls reach every FM core
        run: >-
          make -C tests check-audio-controls
          CC=clang
          CORE=../genesis_plus_gx_libretro.so

      # #30: dos lecturas del mismo frame tienen que dar lo mismo.
      - name: Frame delta survives a second reader
        run: >-
          make -C tests check-frame-delta
          CC=clang
          CORE=../genesis_plus_gx_libretro.so

      # #36: la promesa de "cero trabajo sin subscribers", CONTADA. El gate de
      # tiempo de mas abajo no puede sostenerla -- su ruido medido es de +-3%,
      # del mismo orden que lo que mediria--; un contador en cero si. Este build
      # es de diagnostico y no se publica.
      - name: Build a metrics core
        env:
          CC: clang
          CXX: clang++
        run: >-
          make -B -f Makefile.libretro platform=unix
          AYTHER_EXTENSIONS=1 SOUND_PROBE=1 AYTHER_METRICS=1 -j2

      - name: Idle does exactly zero work
        run: >-
          make -C tests check-idle-metrics
          CC=clang
          CORE=../genesis_plus_gx_libretro.so

      # #41: la region de atribucion con una suscripcion que pide SOLO
      # atribucion. Ese caso devolvia cero bytes y un OK.
      - name: Attribution answers a subscription that asks only for it
        run: >-
          make -C tests check-attribution-scene
          CC=clang
          CORE=../genesis_plus_gx_libretro.so

      # #42: el estado de render por scanline, contra la tabla de hscroll que
      # el propio ROM escribe. El oraculo sale del generador, no del core.
      - name: Plane tile suppression hides one plane at a time
        run: >-
          make -C tests check-plane-suppress
          CORE=../genesis_plus_gx_libretro.so

      - name: The five recomposition layers match their golden
        run: >-
          make -C tests check-multilayer
          CORE=../genesis_plus_gx_libretro.so

      - name: Journal, frame hashes and resolved palette
        run: >-
          make -C tests check-observability
          CORE=../genesis_plus_gx_libretro.so

      - name: Per-scanline state matches the ROM's own scroll table
        run: >-
          make -C tests check-line-state
          CC=clang
          CORE=../genesis_plus_gx_libretro.so

      # #35: un hash por modo de video. El fixture determinista cubre Mode 5
      # H40 progresivo NTSC y nada mas; estas ocho escenas cubren H32, window,
      # shadow/highlight, los dos interlaces, PAL y DMA fill. Un golden POR
      # ESCENA es lo que convierte "algo se rompio" en "se rompio el interlace".
      - name: Video modes match their per-scene golden
        run: >-
          make -C tests check-scenes
          CC=clang
          CORE=../genesis_plus_gx_libretro.so

      # El core de metricas queda en el arbol; los pasos que siguen necesitan el
      # normal de vuelta.
      - name: Rebuild the telemetry core
        env:
          CC: clang
          CXX: clang++
        run: >-
          make -B -f Makefile.libretro platform=unix
          AYTHER_EXTENSIONS=1 SOUND_PROBE=1 -j2

      # El numero se publica pero NO bloquea. Evidencia: dos corridas PARALELAS
      # del mismo commit midieron 1,023% y 1,708% -0,7 puntos de spread sobre
      # binarios identicos-, o sea que el ruido del runner compartido es mayor
      # que el propio umbral de 1%. Un gate asi no mide el codigo, mide en que
      # maquina toco correr, y su unico efecto es ensenar a ignorar el rojo.
      # La medicion sigue siendo util como serie temporal. Ver #35.
      - name: Measure compiled-idle overhead (informative)
        continue-on-error: true
        run: >-
          make -C tests check-profile-comparison
          CC=clang
          PROFILE_OFF_CORE=artifacts/profiles/extensions-off.so
          PROFILE_IDLE_CORE=artifacts/profiles/compiled-idle.so

      - name: Run audio_probe performance baseline
        run: make -C bench run CC=clang

      - name: Upload deterministic and benchmark reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ayther-linux-reports
          path: |
            tests/artifacts/
            bench/artifacts/
          if-no-files-found: error
          retention-days: 30

  sanitizers:
    name: ASan and UBSan
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run isolated tests under ASan and UBSan
        run: >-
          make -C tests check
          CC=clang
          BUILD_DIR=.build/sanitize
          ARTIFACT_DIR=artifacts/sanitize
          CFLAGS="-O1 -g -Wall -Wextra -fsanitize=address,undefined -fno-omit-frame-pointer"
          LDFLAGS="-fsanitize=address,undefined"

      - name: Upload sanitizer trace on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ayther-sanitizer-diagnostics
          path: tests/artifacts/sanitize/
          if-no-files-found: ignore
          retention-days: 14

  full-core-sanitize:
    name: Full core under UBSan (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # #38: hasta aca los sanitizers solo cubrian los binarios construidos
      # contra tests/stub, o sea todo menos vdp_render.c, vdp_ctrl.c, ym2612.c y
      # libretro.c, que es donde vive el fork. El unico test que los ejercita
      # -full_core_replay- nunca corria instrumentado.
      # UBSan y no ASan: el core se construye como .so con -Wl,--no-undefined, y
      # el runtime de ASan no se linkea en una biblioteca compartida -se espera
      # en el ejecutable que la carga-, asi que quedan undefined references a
      # __asan_report_*. Hacerlo andar exigiria construir tambien el harness con
      # ASan y precargar el runtime. UBSan si se puede linkear adentro con
      # -static-libsan, y es el que encontro los hallazgos de #38.
      # ASan sobre el core completo queda pendiente en #45.
      # -shared-libsan y no -static-libsan: clang NO linkea el runtime del
      # sanitizer dentro de una biblioteca compartida -da por sentado que lo
      # aporta el ejecutable-, asi que con el estatico quedan undefined
      # references a __ubsan_handle_*. Con el compartido la .so queda con un
      # DT_NEEDED al runtime y resuelve.
      - name: Build the core with UBSan
        env:
          CC: clang
          CXX: clang++
        run: >-
          make -B -f Makefile.libretro platform=unix
          SOUND_PROBE=1
          CC="clang -fsanitize=undefined -shared-libsan -fno-omit-frame-pointer -g"
          -j2

      # El harness tambien: es quien hace dlopen del core, y asi el runtime ya
      # esta cargado e inicializado cuando entra la biblioteca.
      - name: Build the replay harness with UBSan
        run: >-
          make -C tests full-core-replay CC=clang
          CFLAGS="-O1 -g -Wall -Wextra -fsanitize=undefined -shared-libsan -fno-omit-frame-pointer"
          LDFLAGS="-fsanitize=undefined -shared-libsan"

      # El veredicto lo da tests/ci/run_sanitizers.sh contra known_ub.txt: es
      # una puerta dura sobre UB NUEVO, con el conocido listado por sitio exacto
      # y con dueno. Apagar -fsanitize=alignment para tapar el conocido taparia
      # tambien los futuros.
      - name: Run the full-core replay under UBSan
        run: |
          # El runtime compartido vive en el directorio de clang, que no esta en
          # el path del loader por defecto.
          export LD_LIBRARY_PATH="$(clang -print-runtime-dir):${LD_LIBRARY_PATH:-}"
          bash tests/ci/run_sanitizers.sh "$(pwd)/genesis_plus_gx_libretro.so"

      - name: Upload sanitizer diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ayther-full-core-sanitize
          path: tests/artifacts/
          if-no-files-found: ignore
          retention-days: 14

  thread-sanitizer:
    name: ThreadSanitizer SPSC stress
    runs-on: ubuntu-latest
    env:
      TSAN_OPTIONS: halt_on_error=1:history_size=7
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run concurrent producer/consumer stress under ThreadSanitizer
        run: >-
          make -C tests check-concurrency
          CC=clang
          BUILD_DIR=.build/tsan
          CFLAGS="-O1 -g -Wall -Wextra -fsanitize=thread -fno-omit-frame-pointer"
          LDFLAGS="-fsanitize=thread"

  windows-msvcrt:
    name: Windows x64 MSVCRT (extensions=${{ matrix.ayther_extensions }}, probe=${{ matrix.sound_probe }}, legacy=${{ matrix.legacy_profile }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ayther_extensions: 0
            sound_probe: 0
            legacy_profile: 0
          - ayther_extensions: 1
            sound_probe: 0
            legacy_profile: 0
          - ayther_extensions: 1
            sound_probe: 1
            legacy_profile: 0
          - ayther_extensions: 1
            sound_probe: 1
            legacy_profile: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned llvm-mingw MSVCRT toolchain
        shell: pwsh
        run: >-
          ./.github/scripts/setup-llvm-mingw.ps1
          -Version $env:LLVM_MINGW_VERSION
          -Sha256 $env:LLVM_MINGW_SHA256

      - name: Build libretro core
        shell: pwsh
        run: >-
          make -f Makefile.libretro platform=win64
          AYTHER_EXTENSIONS=${{ matrix.ayther_extensions }}
          AYTHER_LEGACY_PROFILE=${{ matrix.legacy_profile }}
          SOUND_PROBE=${{ matrix.sound_probe }} -j2

      - name: Verify PE runtime, loadability and exports
        shell: pwsh
        run: >-
          ./.github/scripts/verify-windows-core.ps1
          -DllPath genesis_plus_gx_libretro.dll
          -AytherExtensions ${{ matrix.ayther_extensions }}
          -LegacyProfile ${{ matrix.legacy_profile }}
          -SoundProbe ${{ matrix.sound_probe }}

      - name: Run Windows deterministic tests
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        shell: pwsh
        run: make -C tests check CC=clang

      - name: Replay generated ROM across save/load boundary
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        shell: pwsh
        run: >-
          make -C tests check-full-core
          CC=clang
          CORE=../genesis_plus_gx_libretro.dll

      - name: Reject a savestate written by a different ABI
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        shell: pwsh
        run: >-
          make -C tests check-state-guard
          CC=clang
          CORE=../genesis_plus_gx_libretro.dll

      - name: Report serialized struct layout
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        shell: pwsh
        run: make -C tests state-layout CC=clang

      - name: Audio controls reach every FM core
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        shell: pwsh
        run: >-
          make -C tests check-audio-controls
          CC=clang
          CORE=../genesis_plus_gx_libretro.dll

      - name: Frame delta survives a second reader
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        shell: pwsh
        run: >-
          make -C tests check-frame-delta
          CC=clang
          CORE=../genesis_plus_gx_libretro.dll

      - name: Compare extensions-off and compiled-idle profiles
        continue-on-error: true
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tests\artifacts\profiles | Out-Null
          Copy-Item genesis_plus_gx_libretro.dll tests\artifacts\profiles\compiled-idle.dll
          make -B -f Makefile.libretro platform=win64 AYTHER_EXTENSIONS=0 SOUND_PROBE=0 -j2
          Copy-Item genesis_plus_gx_libretro.dll tests\artifacts\profiles\extensions-off.dll
          make -C tests check-profile-comparison CC=clang PROFILE_OFF_CORE=artifacts/profiles/extensions-off.dll PROFILE_IDLE_CORE=artifacts/profiles/compiled-idle.dll

      - name: Capture Windows performance baseline
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        shell: pwsh
        run: make -C bench run CC=clang

      - name: Upload Windows reports
        if: always() && matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        uses: actions/upload-artifact@v7
        with:
          name: ayther-windows-msvcrt-reports
          path: |
            ayther-artifacts/
            tests/artifacts/
            bench/artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Preserve Windows diagnostics on matrix failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ayther-windows-msvcrt-extensions-${{ matrix.ayther_extensions }}-probe-${{ matrix.sound_probe }}-legacy-${{ matrix.legacy_profile }}-diagnostics
          path: ayther-artifacts/
          if-no-files-found: ignore
          retention-days: 14
  # #35 punto 2: macOS en CI.
  #
  # No es "una plataforma mas". Los runners de macOS son arm64, asi que este
  # job es lo unico que corre los goldens fuera de x86-64, y es la unica
  # forma de saber si el fixture generado y las tablas del VDP dependen de la
  # arquitectura o solo del endianness. Si un golden se mueve aca, lo que hay
  # que mirar es el golden, no el job.
  #
  # Lo que este job NO hace, a proposito: el cierre de exports. `check_exports.sh`
  # lee simbolos con nm/objdump al estilo ELF/PE, y en Mach-O los simbolos llevan
  # un guion bajo delante. Correrlo aca sin adaptarlo daria un verde que no
  # verifica nada, que es peor que no correrlo.
  macos-core:
    name: macOS arm64 (extensions=${{ matrix.ayther_extensions }}, probe=${{ matrix.sound_probe }}, legacy=${{ matrix.legacy_profile }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ayther_extensions: 0
            sound_probe: 0
            legacy_profile: 0
          - ayther_extensions: 1
            sound_probe: 0
            legacy_profile: 0
          - ayther_extensions: 1
            sound_probe: 1
            legacy_profile: 0
          - ayther_extensions: 1
            sound_probe: 1
            legacy_profile: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build libretro core
        run: >-
          make -f Makefile.libretro platform=osx
          AYTHER_EXTENSIONS=${{ matrix.ayther_extensions }}
          AYTHER_LEGACY_PROFILE=${{ matrix.legacy_profile }}
          SOUND_PROBE=${{ matrix.sound_probe }} -j3

      - name: Report the built dylib
        run: |
          set -euo pipefail
          test -f genesis_plus_gx_libretro.dylib
          file genesis_plus_gx_libretro.dylib
          otool -L genesis_plus_gx_libretro.dylib

      - name: Run unit and golden-trace tests
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        run: make -C tests check

      - name: Replay generated ROM across save/load boundary
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        run: >-
          make -C tests check-full-core
          CORE=../genesis_plus_gx_libretro.dylib

      - name: Reject a savestate written by a different ABI
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        run: >-
          make -C tests check-state-guard
          CORE=../genesis_plus_gx_libretro.dylib

      - name: Report serialized struct layout
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        run: make -C tests state-layout

      - name: Audio controls reach every FM core
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        run: >-
          make -C tests check-audio-controls
          CORE=../genesis_plus_gx_libretro.dylib

      - name: Frame delta survives a second reader
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        run: >-
          make -C tests check-frame-delta
          CORE=../genesis_plus_gx_libretro.dylib

      - name: Attribution answers a subscription that asks only for it
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        run: >-
          make -C tests check-attribution-scene
          CORE=../genesis_plus_gx_libretro.dylib

      - name: Plane tile suppression hides one plane at a time
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        run: >-
          make -C tests check-plane-suppress
          CORE=../genesis_plus_gx_libretro.dylib

      - name: The five recomposition layers match their golden
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        run: >-
          make -C tests check-multilayer
          CORE=../genesis_plus_gx_libretro.dylib

      - name: Journal, frame hashes and resolved palette
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        run: >-
          make -C tests check-observability
          CORE=../genesis_plus_gx_libretro.dylib

      - name: Per-scanline state matches the ROM's own scroll table
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        run: >-
          make -C tests check-line-state
          CORE=../genesis_plus_gx_libretro.dylib

      - name: Video modes match their per-scene golden
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        run: >-
          make -C tests check-scenes
          CORE=../genesis_plus_gx_libretro.dylib

      - name: Build a metrics core
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        run: >-
          make -B -f Makefile.libretro platform=osx
          AYTHER_EXTENSIONS=1 SOUND_PROBE=1 AYTHER_METRICS=1 -j3

      - name: Idle does exactly zero work
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        run: >-
          make -C tests check-idle-metrics
          CORE=../genesis_plus_gx_libretro.dylib

      - name: Preserve macOS diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ayther-macos-extensions-${{ matrix.ayther_extensions }}-probe-${{ matrix.sound_probe }}-legacy-${{ matrix.legacy_profile }}-diagnostics
          path: |
            ayther-artifacts/
            tests/artifacts/
          if-no-files-found: ignore
          retention-days: 14
  # #43 punto 5: LTO. El issue pedia un job que compile con -flto y compare, y
  # que se adopte si mejora >= 3% sin romper goldens. Medido en Linux/gcc:
  #
  #   sin LTO   .so 12.917.992   .text 1.211.647
  #   con LTO   .so 11.224.584   .text 1.267.191
  #
  # El .so total baja 13%, pero eso es casi todo simbolos y debug, que no se
  # cargan. Lo que corre -- .text-- CRECE 4,6%: LTO inlinea entre unidades y la
  # presion sobre la i-cache sube. Sobre velocidad no se puede decidir con este
  # harness: el bench tiene +-3% de ruido y el umbral del issue es exactamente
  # 3%, asi que cualquier veredicto seria ruido con forma de conclusion.
  #
  # Conclusion: NO se adopta por defecto. Queda como `AYTHER_LTO=1`, y este job
  # existe para que siga funcionando -- un build con LTO es donde aparece el UB
  # entre unidades- y para que los 14 clones fast/observed sigan separados: si
  # LTO los fusionara, el patron que sostiene el "cero costo en idle" se cae.
  lto-build:
    name: LTO build (opt-in, no adoptado)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build with and without LTO
        run: |
          set -euo pipefail
          make -B -f Makefile.libretro platform=unix AYTHER_EXTENSIONS=1 SOUND_PROBE=1 -j2
          cp genesis_plus_gx_libretro.so base.so
          make -B -f Makefile.libretro platform=unix AYTHER_EXTENSIONS=1 SOUND_PROBE=1 \
            AYTHER_LTO=1 -j2

      - name: Report both sizes
        run: |
          set -euo pipefail
          for f in base.so genesis_plus_gx_libretro.so; do
            printf '%-28s total=%-10s .text=%s\n' "$f" "$(stat -c%s "$f")" \
              "$(size -A "$f" | awk '$1==".text"{print $2}')"
          done

      # Lo que este job protege de verdad: que LTO no deshaga el patron
      # fast/observed. Son 7 pares; si aparecen menos, alguno se fusiono.
      - name: The fast/observed clones survive LTO
        run: |
          set -euo pipefail
          n=$(nm genesis_plus_gx_libretro.so | grep -cE '_(fast|observed)_path')
          echo "clones separados: $n"
          test "$n" -eq 14

      - name: Verify shared-library exports
        run: |
          set -euo pipefail
          nm -D --defined-only genesis_plus_gx_libretro.so | sed 's/.* //' > exports.txt
          bash tests/ci/check_exports.sh exports.txt 1 0 1

      - name: Goldens hold under LTO
        run: |
          set -euo pipefail
          make -C tests check
          for t in check-full-core check-scenes check-line-state check-determinism \
                   check-abi-dynamic check-multilayer check-observability; do
            make -C tests "$t" CORE=../genesis_plus_gx_libretro.so
          done
