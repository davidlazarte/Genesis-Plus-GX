name: AYTHER CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ayther-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_MINGW_VERSION: "20260519"
  LLVM_MINGW_SHA256: "2fa481d30909cbdcf740c6dce11a3f1e72224070cde76c0683289f0bb44f4dd9"

jobs:
  source-quality:
    name: Source quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check whitespace in changed lines
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git -c core.whitespace=cr-at-eol diff --check "$BASE_SHA...HEAD"
          else
            git -c core.whitespace=cr-at-eol show --check --format=fuller --no-renames HEAD
          fi

      - name: Enforce LF in AYTHER automation and fixtures
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --eol .github/workflows tests bench | grep -E 'w/(crlf|mixed)'; then
            echo "AYTHER CI, test and benchmark files must use LF line endings." >&2
            exit 1
          fi

  linux-core:
    name: Linux core (${{ matrix.compiler }}, extensions=${{ matrix.ayther_extensions }}, probe=${{ matrix.sound_probe }}, legacy=${{ matrix.legacy_profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
            ayther_extensions: 0
            sound_probe: 0
            legacy_profile: 0
          - compiler: gcc
            cc: gcc
            cxx: g++
            ayther_extensions: 1
            sound_probe: 0
            legacy_profile: 0
          - compiler: gcc
            cc: gcc
            cxx: g++
            ayther_extensions: 1
            sound_probe: 1
            legacy_profile: 0
          - compiler: clang
            cc: clang
            cxx: clang++
            ayther_extensions: 1
            sound_probe: 1
            legacy_profile: 0
          - compiler: gcc
            cc: gcc
            cxx: g++
            ayther_extensions: 1
            sound_probe: 1
            legacy_profile: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build libretro core
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >-
          make -f Makefile.libretro platform=unix
          AYTHER_EXTENSIONS=${{ matrix.ayther_extensions }}
          AYTHER_LEGACY_PROFILE=${{ matrix.legacy_profile }}
          SOUND_PROBE=${{ matrix.sound_probe }} -j2

      - name: Verify shared-library exports
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          AYTHER_EXTENSIONS: ${{ matrix.ayther_extensions }}
          LEGACY_PROFILE: ${{ matrix.legacy_profile }}
          SOUND_PROBE: ${{ matrix.sound_probe }}
        run: |
          set -euo pipefail
          mkdir -p ayther-artifacts
          nm -D --defined-only genesis_plus_gx_libretro.so > ayther-artifacts/exports.txt
          grep -Eq '[[:space:]]retro_init$' ayther-artifacts/exports.txt
          grep -Eq '[[:space:]]retro_run$' ayther-artifacts/exports.txt
          if [[ "$AYTHER_EXTENSIONS" == "1" ]]; then
            grep -Eq '[[:space:]]ayther_get_interface$' ayther-artifacts/exports.txt
            if grep -E '[[:space:]]ayther_' ayther-artifacts/exports.txt | \
               grep -Ev '[[:space:]]ayther_get_interface$'; then
              echo "unexpected additional AYTHER export" >&2
              exit 1
            fi
          else
            nm --defined-only genesis_plus_gx_libretro.so > ayther-artifacts/symbols.txt
            if grep -Eq '[[:space:]](ayther_|audio_probe_)' ayther-artifacts/symbols.txt; then
              echo "AYTHER implementation leaked from extensions-off build" >&2
              exit 1
            fi
          fi
          if [[ "$AYTHER_EXTENSIONS" == "1" && "$SOUND_PROBE" == "1" ]]; then
            grep -Eq '[[:space:]]audio_probe_poll$' ayther-artifacts/exports.txt
            grep -Eq '[[:space:]]audio_probe_set_callback$' ayther-artifacts/exports.txt
          elif grep -Eq '[[:space:]]audio_probe_' ayther-artifacts/exports.txt; then
            echo "audio_probe symbols leaked from the feature-off build" >&2
            exit 1
          fi
          "$CC" -O2 -Wall -Wextra -o ayther-artifacts/load_core tests/ci/load_core.c -ldl
          required=(retro_init retro_run)
          if [[ "$AYTHER_EXTENSIONS" == "1" ]]; then
            required+=(ayther_get_interface)
          fi
          if [[ "$AYTHER_EXTENSIONS" == "1" && "$SOUND_PROBE" == "1" ]]; then
            required+=(
              audio_probe_poll
              audio_probe_set_callback
              audio_probe_get_transport_stats
              audio_probe_reset_transport_stats
              audio_probe_get_context
              audio_probe_set_channel_gain
              audio_probe_get_channel_gain
            )
          fi
          ayther-artifacts/load_core "$(pwd)/genesis_plus_gx_libretro.so" "${required[@]}"
          "$CC" -O2 -Wall -Wextra -Icore -o ayther-artifacts/verify_ayther_api \
            tests/ci/verify_ayther_api.c -ldl
          if [[ "$AYTHER_EXTENSIONS" == "1" ]]; then
            abi_args=("$(pwd)/genesis_plus_gx_libretro.so" --require)
            if [[ "$LEGACY_PROFILE" == "1" ]]; then
              abi_args+=(--legacy)
            fi
            ayther-artifacts/verify_ayther_api "${abi_args[@]}"
          else
            ayther-artifacts/verify_ayther_api \
              "$(pwd)/genesis_plus_gx_libretro.so"
          fi
          "$CC" -shared -fPIC -o ayther-artifacts/mock_stock_core.so \
            tests/ci/mock_stock_core.c
          ayther-artifacts/verify_ayther_api \
            "$(pwd)/ayther-artifacts/mock_stock_core.so"

      - name: Preserve export diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: linux-exports-${{ matrix.compiler }}-extensions-${{ matrix.ayther_extensions }}-probe-${{ matrix.sound_probe }}-legacy-${{ matrix.legacy_profile }}
          path: ayther-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  deterministic-tests:
    name: Full-core determinism and performance (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run unit and golden-trace tests
        run: make -C tests check CC=clang

      - name: Build extensions-off performance reference
        env:
          CC: clang
          CXX: clang++
        run: |
          make -B -f Makefile.libretro platform=unix AYTHER_EXTENSIONS=0 SOUND_PROBE=0 -j2
          mkdir -p tests/artifacts/profiles
          cp genesis_plus_gx_libretro.so tests/artifacts/profiles/extensions-off.so

      - name: Build telemetry-enabled core for deterministic replay
        env:
          CC: clang
          CXX: clang++
        run: >-
          make -B -f Makefile.libretro platform=unix
          AYTHER_EXTENSIONS=1 SOUND_PROBE=1 -j2

      - name: Preserve compiled-idle performance candidate
        run: cp genesis_plus_gx_libretro.so tests/artifacts/profiles/compiled-idle.so

      - name: Replay generated ROM across save/load boundary
        run: >-
          make -C tests check-full-core
          CC=clang
          CORE=../genesis_plus_gx_libretro.so

      - name: Enforce compiled-idle overhead target
        run: >-
          make -C tests check-profile-comparison
          CC=clang
          PROFILE_OFF_CORE=artifacts/profiles/extensions-off.so
          PROFILE_IDLE_CORE=artifacts/profiles/compiled-idle.so

      - name: Run audio_probe performance baseline
        run: make -C bench run CC=clang

      - name: Upload deterministic and benchmark reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ayther-linux-reports
          path: |
            tests/artifacts/
            bench/artifacts/
          if-no-files-found: error
          retention-days: 30

  sanitizers:
    name: ASan and UBSan
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run isolated tests under ASan and UBSan
        run: >-
          make -C tests check
          CC=clang
          BUILD_DIR=.build-sanitize
          ARTIFACT_DIR=artifacts-sanitize
          CFLAGS="-O1 -g -Wall -Wextra -fsanitize=address,undefined -fno-omit-frame-pointer"
          LDFLAGS="-fsanitize=address,undefined"

      - name: Upload sanitizer trace on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ayther-sanitizer-diagnostics
          path: tests/artifacts-sanitize/
          if-no-files-found: ignore
          retention-days: 14

  thread-sanitizer:
    name: ThreadSanitizer SPSC stress
    runs-on: ubuntu-latest
    env:
      TSAN_OPTIONS: halt_on_error=1:history_size=7
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run concurrent producer/consumer stress under ThreadSanitizer
        run: >-
          make -C tests check-concurrency
          CC=clang
          BUILD_DIR=.build-tsan
          CFLAGS="-O1 -g -Wall -Wextra -fsanitize=thread -fno-omit-frame-pointer"
          LDFLAGS="-fsanitize=thread"

  windows-msvcrt:
    name: Windows x64 MSVCRT (extensions=${{ matrix.ayther_extensions }}, probe=${{ matrix.sound_probe }}, legacy=${{ matrix.legacy_profile }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ayther_extensions: 0
            sound_probe: 0
            legacy_profile: 0
          - ayther_extensions: 1
            sound_probe: 0
            legacy_profile: 0
          - ayther_extensions: 1
            sound_probe: 1
            legacy_profile: 0
          - ayther_extensions: 1
            sound_probe: 1
            legacy_profile: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned llvm-mingw MSVCRT toolchain
        shell: pwsh
        run: >-
          ./.github/scripts/setup-llvm-mingw.ps1
          -Version $env:LLVM_MINGW_VERSION
          -Sha256 $env:LLVM_MINGW_SHA256

      - name: Build libretro core
        shell: pwsh
        run: >-
          make -f Makefile.libretro platform=win64
          AYTHER_EXTENSIONS=${{ matrix.ayther_extensions }}
          AYTHER_LEGACY_PROFILE=${{ matrix.legacy_profile }}
          SOUND_PROBE=${{ matrix.sound_probe }} -j2

      - name: Verify PE runtime, loadability and exports
        shell: pwsh
        run: >-
          ./.github/scripts/verify-windows-core.ps1
          -DllPath genesis_plus_gx_libretro.dll
          -AytherExtensions ${{ matrix.ayther_extensions }}
          -LegacyProfile ${{ matrix.legacy_profile }}
          -SoundProbe ${{ matrix.sound_probe }}

      - name: Run Windows deterministic tests
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        shell: pwsh
        run: make -C tests check CC=clang

      - name: Replay generated ROM across save/load boundary
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        shell: pwsh
        run: >-
          make -C tests check-full-core
          CC=clang
          CORE=../genesis_plus_gx_libretro.dll

      - name: Compare extensions-off and compiled-idle profiles
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tests\artifacts\profiles | Out-Null
          Copy-Item genesis_plus_gx_libretro.dll tests\artifacts\profiles\compiled-idle.dll
          make -B -f Makefile.libretro platform=win64 AYTHER_EXTENSIONS=0 SOUND_PROBE=0 -j2
          Copy-Item genesis_plus_gx_libretro.dll tests\artifacts\profiles\extensions-off.dll
          make -C tests check-profile-comparison CC=clang PROFILE_OFF_CORE=artifacts/profiles/extensions-off.dll PROFILE_IDLE_CORE=artifacts/profiles/compiled-idle.dll

      - name: Capture Windows performance baseline
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        shell: pwsh
        run: make -C bench run CC=clang

      - name: Upload Windows reports
        if: always() && matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        uses: actions/upload-artifact@v7
        with:
          name: ayther-windows-msvcrt-reports
          path: |
            ayther-artifacts/
            tests/artifacts/
            bench/artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Preserve Windows diagnostics on matrix failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ayther-windows-msvcrt-extensions-${{ matrix.ayther_extensions }}-probe-${{ matrix.sound_probe }}-legacy-${{ matrix.legacy_profile }}-diagnostics
          path: ayther-artifacts/
          if-no-files-found: ignore
          retention-days: 14
