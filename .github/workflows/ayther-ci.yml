name: AYTHER CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ayther-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_MINGW_VERSION: "20260519"
  LLVM_MINGW_SHA256: "2fa481d30909cbdcf740c6dce11a3f1e72224070cde76c0683289f0bb44f4dd9"
  # #45.A: el mismo release, la otra CRT. Sale del digest que publica la API
  # de releases de GitHub, no de bajarlo y confiar.
  LLVM_MINGW_UCRT_SHA256: "72dbd6e64614e3b3401998992d1bd9c8ace29e74611d71c80309ea71c3fb26f9"

jobs:
  source-quality:
    name: Source quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # El gate vale para el codigo QUE ESCRIBIMOS NOSOTROS. Upstream commitea
      # con trailing whitespace, asi que un `diff --check` acumulado sobre el
      # rango entero rebotaba TODO PR de sync: no por algo que hicimos mal, sino
      # porque el rango incluye las lineas de upstream. Y el arreglo tentador
      # -limpiar esas lineas- diverge de upstream justo donde mas duele: cada
      # vez que upstream las vuelva a tocar, conflicto, para siempre y a cambio
      # de nada.
      #
      # Por eso se revisa COMMIT POR COMMIT y se saltean los que ya viven
      # aguas arriba. Los nuestros se siguen revisando enteros, incluidos los
      # de un PR que ademas trae un sync: el #46 trajo 24 commits de upstream y
      # uno nuestro, y el nuestro tiene que pasar igual.
      #
      # #74: "aguas arriba" son DOS remotos, no uno. libretro es el espejo y a
      # veces se retrasa -- llego a estar 18 commits detras--, asi que un sync
      # puede traer commits que todavia no son ancestros de upstream/master
      # pero si de ekeeke/master. Un commit que ya vive en cualquiera de los dos
      # no lo escribimos nosotros, y dos de los que trajo este sync vienen con
      # trailing whitespace de upstream (e12da78f en md_cart.c, 774e360a en
      # libretro.c): sin este salteo el PR del sync sale rojo por lineas ajenas,
      # que es exactamente el modo de falla que el parrafo de arriba describe.
      - name: Check whitespace in changed lines
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          UPSTREAM_URL: https://github.com/libretro/Genesis-Plus-GX.git
          EKEEKE_URL: https://github.com/ekeeke/Genesis-Plus-GX.git
        run: |
          set -euo pipefail
          git remote get-url upstream >/dev/null 2>&1 || git remote add upstream "$UPSTREAM_URL"
          git remote get-url ekeeke >/dev/null 2>&1 || git remote add ekeeke "$EKEEKE_URL"
          # Si el fetch falla NO se saltea nada: se revisa todo y el job se pone
          # rojo. Fallar cerrado es lo correcto; un fetch caido que apagara el
          # gate en silencio es exactamente el modo de falla que no queremos.
          # Vale para los dos remotos por separado: que se caiga uno no apaga el
          # salteo del otro, y que se caigan los dos revisa todo.
          git fetch --no-tags --quiet upstream master || echo "AVISO: fetch de upstream fallo; no se saltea ningun commit de libretro." >&2
          git fetch --no-tags --quiet ekeeke master || echo "AVISO: fetch de ekeeke fallo; no se saltea ningun commit de ekeeke." >&2
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$BASE_SHA..HEAD"
          else
            range="HEAD~1..HEAD"
          fi
          status=0
          for commit in $(git rev-list --no-merges "$range"); do
            if git merge-base --is-ancestor "$commit" upstream/master 2>/dev/null                || git merge-base --is-ancestor "$commit" ekeeke/master 2>/dev/null; then
              continue
            fi
            parent=$(git rev-parse -q --verify "$commit^") || continue
            # Un cambio de fin de linea reescribe TODAS las lineas del archivo,
            # asi que `--check` las ve como agregadas y aflora el trailing
            # whitespace que YA ESTABA. Ese whitespace no lo introdujo este
            # commit: cambiar el EOL no toca los espacios. Por eso se revisan
            # solo los archivos cuyo CONTENIDO cambio, y no el commit entero.
            # --numstat con --ignore-cr-at-eol es lo que sabe la diferencia;
            # --name-only NO sirve, lista igual los archivos EOL-only.
            mapfile -t paths < <(git -c core.quotePath=false diff --numstat --ignore-cr-at-eol --no-renames "$parent" "$commit" | awk -F'	' '$1 != "-" && $1 + $2 > 0 { print $3 }')
            [ "${#paths[@]}" -gt 0 ] || continue
            git -c core.whitespace=cr-at-eol show --check --format=fuller --no-renames "$commit" -- "${paths[@]}" || status=1
          done
          exit "$status"

      # Un flip de fin de linea reescribe el archivo entero y NO lo atrapa el
      # gate de whitespace, que solo mira espacios. Paso de verdad: el commit
      # del hook de ym3438.c figuraba con 2886 lineas cambiadas para un cambio
      # de 12, y volvio a divergir de upstream justo despues de que bajaramos
      # la divergencia de 170 archivos a 27. Peor: un flip JUNTO CON un cambio
      # de contenido tambien rompe el gate de whitespace, porque el archivo
      # entero pasa a contar como lineas agregadas y aflora el trailing
      # whitespace preexistente de upstream.
      #
      # El invariante se mide contra UPSTREAM, no contra el commit anterior.
      # Comparar con el commit anterior no distingue alejarse de upstream
      # -- que es el defecto-- de volver -- que es la reparacion--, y termina
      # bloqueando justo al que viene a arreglarlo.
      - name: EOL style must match upstream
        shell: bash
        env:
          UPSTREAM_URL: https://github.com/libretro/Genesis-Plus-GX.git
        run: |
          set -euo pipefail
          git remote get-url upstream >/dev/null 2>&1 || git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags --quiet upstream master || {
            echo "AVISO: fetch de upstream fallo; no se puede comparar." >&2; exit 0; }
          # #43: la regla vive en tests/ci/check_eol.sh para poder correrla ANTES
          # de pushear, y barre todo lo que difiere de upstream en vez de solo los
          # archivos que toco este PR.
          bash tests/ci/check_eol.sh

      - name: Enforce LF in AYTHER automation and fixtures
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --eol .github/workflows tests bench | grep -E 'w/(crlf|mixed)'; then
            echo "AYTHER CI, test and benchmark files must use LF line endings." >&2
            exit 1
          fi

      # #28: los gates de capa viven DENTRO de cada renderer Mode 5, y hay
      # cinco. Cuando se agregaron, tres se quedaron sin ellos y el sintoma fue
      # el peor posible: escribir la mascara no hacia nada, sin error ni motivo
      # de fallback. Un test de pixeles necesita una escena por modo (#35);
      # esto ataca la reincidencia, que es un renderer NUEVO sin gates.
      - name: Every Mode 5 renderer consults the layer gates
        run: bash tests/ci/check_render_gates.sh

      # #104: la deteccion de shell, probada. La condicion era
      # `$(findstring sh,$(notdir $(SHELL)))` y "pwsh" contiene "sh", asi que
      # con SHELL=pwsh.exe -- el shell de los pasos de Windows de este mismo
      # workflow-- las recetas POSIX se le mandaban a PowerShell. No se veia
      # porque en los runners hay un sh.exe en el PATH y make lo prefiere: una
      # bomba de tiempo, no una teoria. Corre aca porque solo necesita make.
      - name: The shell detection tells pwsh apart from a POSIX shell
        run: bash tests/ci/check_shell_detection.sh

      # #103: el gate de UB, probado. filter_known_ub.sh es lo unico que separa
      # "el core esta limpio" de "el core tiene UB que nadie miro", y nadie lo
      # habia probado nunca: se confiaba en que un hallazgo real lo pusiera en
      # rojo alguna vez. Corre aca y no en un job con core porque son logs
      # sinteticos: no necesita compilar nada y da el veredicto en un segundo.
      - name: The known-UB filter fails on anything it should not accept
        run: bash tests/ci/check_filter_known_ub.sh

      # #68: cuantos hunks nuestros hay en cada archivo de upstream, contra una
      # linea base versionada. Subir un numero es legitimo, pero se hace a
      # proposito y se dice: el PR que agrega un hook regenera la linea base
      # (`bash tests/ci/check_upstream_contact.sh --regen`) y el cambio queda a
      # la vista en el diff. Mismo trato que un golden.
      - name: Contact points with upstream do not grow unannounced
        run: bash tests/ci/check_upstream_contact.sh

  linux-core:
    name: Linux core (${{ matrix.compiler }}, extensions=${{ matrix.ayther_extensions }}, probe=${{ matrix.sound_probe }}, legacy=${{ matrix.legacy_profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
            ayther_extensions: 0
            sound_probe: 0
            legacy_profile: 0
          - compiler: gcc
            cc: gcc
            cxx: g++
            ayther_extensions: 1
            sound_probe: 0
            legacy_profile: 0
          - compiler: gcc
            cc: gcc
            cxx: g++
            ayther_extensions: 1
            sound_probe: 1
            legacy_profile: 0
          - compiler: clang
            cc: clang
            cxx: clang++
            ayther_extensions: 1
            sound_probe: 1
            legacy_profile: 0
          - compiler: gcc
            cc: gcc
            cxx: g++
            ayther_extensions: 1
            sound_probe: 1
            legacy_profile: 1
          # #33: HOOK_CPU nunca se compilaba en CI, y por eso llevaba tiempo
          # roto: cpuhook.h definia `cpu_hook` en vez de declararlo, lo cual
          # solo linkeaba con -fcommon (default hasta gcc 9 / clang 10).
          - compiler: clang
            cc: clang
            cxx: clang++
            ayther_extensions: 1
            sound_probe: 1
            legacy_profile: 0
            hook_cpu: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build libretro core
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >-
          make -f Makefile.libretro platform=unix
          AYTHER_EXTENSIONS=${{ matrix.ayther_extensions }}
          AYTHER_LEGACY_PROFILE=${{ matrix.legacy_profile }}
          SOUND_PROBE=${{ matrix.sound_probe }}
          HOOK_CPU=${{ matrix.hook_cpu || 0 }} -j2

      - name: Verify shared-library exports
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          AYTHER_EXTENSIONS: ${{ matrix.ayther_extensions }}
          LEGACY_PROFILE: ${{ matrix.legacy_profile }}
          SOUND_PROBE: ${{ matrix.sound_probe }}
        run: |
          set -euo pipefail
          mkdir -p ayther-artifacts
          nm -D --defined-only genesis_plus_gx_libretro.so > ayther-artifacts/exports.txt
          grep -Eq '[[:space:]]retro_init$' ayther-artifacts/exports.txt
          grep -Eq '[[:space:]]retro_run$' ayther-artifacts/exports.txt
          # #32: el closure lo decide tests/ci/check_exports.sh contra
          # allowed_exports.txt, la MISMA lista que usa el job de Windows.
          # Cuando la regla estaba escrita aca y en el .ps1, divergieron sin que
          # nada lo notara: cada job solo corre en su plataforma.
          awk '{print $NF}' ayther-artifacts/exports.txt | sort -u > ayther-artifacts/export_names.txt
          bash tests/ci/check_exports.sh ayther-artifacts/export_names.txt "$AYTHER_EXTENSIONS" "$LEGACY_PROFILE" "$SOUND_PROBE" | tee ayther-artifacts/export_closure.txt
          if [[ "$AYTHER_EXTENSIONS" != "1" ]]; then
            # Sin extensiones no puede quedar ni la implementacion interna.
            nm --defined-only genesis_plus_gx_libretro.so > ayther-artifacts/symbols.txt
            if grep -Eq '[[:space:]](ayther_|audio_probe_)' ayther-artifacts/symbols.txt; then
              echo "AYTHER implementation leaked from extensions-off build" >&2
              exit 1
            fi
          fi
          "$CC" -O2 -Wall -Wextra -o ayther-artifacts/load_core tests/ci/load_core.c -ldl
          # Lo que tiene que RESOLVER dinamicamente sale de la misma lista, para
          # no volver a mantener dos copias de la superficie publica.
          required=(retro_init retro_run)
          for symbol in $(sed -n 's/^export closure OK ([^)]*): //p' ayther-artifacts/export_closure.txt); do
            required+=("$symbol")
          done
          ayther-artifacts/load_core "$(pwd)/genesis_plus_gx_libretro.so" "${required[@]}"
          "$CC" -O2 -Wall -Wextra -Icore -o ayther-artifacts/verify_ayther_api \
            tests/ci/verify_ayther_api.c -ldl
          if [[ "$AYTHER_EXTENSIONS" == "1" ]]; then
            abi_args=("$(pwd)/genesis_plus_gx_libretro.so" --require)
            if [[ "$LEGACY_PROFILE" == "1" ]]; then
              abi_args+=(--legacy)
            fi
            ayther-artifacts/verify_ayther_api "${abi_args[@]}"
          else
            ayther-artifacts/verify_ayther_api \
              "$(pwd)/genesis_plus_gx_libretro.so"
          fi
          # #33: un cliente compilado contra 1.0, que no conoce 1.1 ni 1.2.
          # Congelar offsets contra el header actual detecta un reordenamiento
          # pero no contesta si un frontend ya compilado sigue funcionando.
          if [[ "$AYTHER_EXTENSIONS" == "1" ]]; then
            "$CC" -O2 -Wall -Wextra -o ayther-artifacts/abi_compat_1_0 tests/ci/abi_compat_1_0.c -ldl
            ayther-artifacts/abi_compat_1_0 "$(pwd)/genesis_plus_gx_libretro.so"
          fi
          "$CC" -shared -fPIC -o ayther-artifacts/mock_stock_core.so \
            tests/ci/mock_stock_core.c
          ayther-artifacts/verify_ayther_api \
            "$(pwd)/ayther-artifacts/mock_stock_core.so"

      - name: Preserve export diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: linux-exports-${{ matrix.compiler }}-extensions-${{ matrix.ayther_extensions }}-probe-${{ matrix.sound_probe }}-legacy-${{ matrix.legacy_profile }}
          path: ayther-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  deterministic-tests:
    name: Full-core determinism and performance (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run unit and golden-trace tests
        run: make -C tests check CC=clang

      - name: Build extensions-off performance reference
        env:
          CC: clang
          CXX: clang++
        run: |
          make -B -f Makefile.libretro platform=unix AYTHER_EXTENSIONS=0 SOUND_PROBE=0 -j2
          mkdir -p tests/artifacts/profiles
          cp genesis_plus_gx_libretro.so tests/artifacts/profiles/extensions-off.so

      - name: Build telemetry-enabled core for deterministic replay
        env:
          CC: clang
          CXX: clang++
        run: >-
          make -B -f Makefile.libretro platform=unix
          AYTHER_EXTENSIONS=1 SOUND_PROBE=1 -j2

      - name: Preserve compiled-idle performance candidate
        run: cp genesis_plus_gx_libretro.so tests/artifacts/profiles/compiled-idle.so

      - name: Replay generated ROM across save/load boundary
        run: >-
          make -C tests check-full-core
          CC=clang
          CORE=../genesis_plus_gx_libretro.so

      - name: Reject a savestate written by a different ABI
        run: >-
          make -C tests check-state-guard
          CC=clang
          CORE=../genesis_plus_gx_libretro.so

      # #97: un savestate de Sega CD con un indice de pista fuera de la TOC se
      # rechaza, en vez de cargarse corrido. Es el primer test que carga un
      # estado de CD; el fixture es una BIOS y una imagen sinteticas.
      - name: Reject a Sega CD savestate with an invalid track index
        run: >-
          make -C tests check-state-scd-guard
          CC=clang
          CORE=../genesis_plus_gx_libretro.so

      # #45: los tamanios quedan en el log de las DOS plataformas; comparar la
      # divergencia de state_hash pasa a ser leer dos corridas.
      - name: Report serialized struct layout
        run: make -C tests state-layout CC=clang

      # #29: que la mascara de mute llegue a los DOS cores de FM.
      - name: Audio controls reach every FM core
        run: >-
          make -C tests check-audio-controls
          CC=clang
          CORE=../genesis_plus_gx_libretro.so

      # #75: el savestate de SMS con Nuked tiene que cargar en un PROCESO
      # nuevo y dar lo mismo que en el mismo proceso. Es lo unico que agarra
      # un puntero serializado: dentro de una sola sesion la direccion sigue
      # siendo valida y no falla nada.
      - name: SMS savestate with Nuked FM survives a new process
        run: >-
          make -C tests check-state-cross-process
          CC=clang
          CORE=../genesis_plus_gx_libretro.so

      # #76: el savestate tiene que estar COMPLETO. Guardar, correr, recargar,
      # correr lo mismo y comparar; sin golden, el oraculo es la corrida de al
      # lado. Sobre Mega Drive, Master System, SMS con FM Nuked y Game Gear.
      - name: Savestate roundtrip is complete on every system
        run: >-
          make -C tests check-state-roundtrip
          CC=clang
          CORE=../genesis_plus_gx_libretro.so

      # #30: dos lecturas del mismo frame tienen que dar lo mismo.
      - name: Frame delta survives a second reader
        run: >-
          make -C tests check-frame-delta
          CC=clang
          CORE=../genesis_plus_gx_libretro.so

      # #77: el descriptor de sistema describe el frame emitido, y avisa cuando
      # los registros ya cambiaron la geometria del que viene.
      - name: System descriptor names the frame it describes
        run: >-
          make -C tests check-system-transition
          CC=clang
          CORE=../genesis_plus_gx_libretro.so

      # #63: el Z80 martillando el puerto de datos del VDP por la ventana de
      # banco. Sin instrumentar solo verifica que el camino existe y el core
      # sigue vivo; con ASan (job nocturno) es el que ve la lectura fuera de
      # fifo_timing_h40.
      - name: Z80 hammering the VDP data port keeps the core alive
        run: >-
          make -C tests check-z80-vdp-fifo
          CC=clang
          CORE=../genesis_plus_gx_libretro.so

      # #36: la promesa de "cero trabajo sin subscribers", CONTADA. El gate de
      # tiempo de mas abajo no puede sostenerla -- su ruido medido es de +-3%,
      # del mismo orden que lo que mediria--; un contador en cero si. Este build
      # es de diagnostico y no se publica.
      - name: Build a metrics core
        env:
          CC: clang
          CXX: clang++
        run: >-
          make -B -f Makefile.libretro platform=unix
          AYTHER_EXTENSIONS=1 SOUND_PROBE=1 AYTHER_METRICS=1 -j2

      - name: Idle does exactly zero work
        run: >-
          make -C tests check-idle-metrics
          CC=clang
          CORE=../genesis_plus_gx_libretro.so

      # #41: la region de atribucion con una suscripcion que pide SOLO
      # atribucion. Ese caso devolvia cero bytes y un OK.
      - name: Attribution answers a subscription that asks only for it
        run: >-
          make -C tests check-attribution-scene
          CC=clang
          CORE=../genesis_plus_gx_libretro.so

      # #42: el estado de render por scanline, contra la tabla de hscroll que
      # el propio ROM escribe. El oraculo sale del generador, no del core.
      - name: Plane tile suppression hides one plane at a time
        run: >-
          make -C tests check-plane-suppress
          CORE=../genesis_plus_gx_libretro.so

      - name: The five recomposition layers match their golden
        run: >-
          make -C tests check-multilayer
          CORE=../genesis_plus_gx_libretro.so

      - name: Journal, frame hashes and resolved palette
        run: >-
          make -C tests check-observability
          CORE=../genesis_plus_gx_libretro.so

      # #40: ya no necesita un cartucho comercial. El fixture SMS del repo
      # -- codigo Z80-- pone la escena, y en su primera corrida encontro un
      # defecto que el ROM real no podia mostrar: suprimir un slot borraba
      # tambien el siguiente.
      - name: Mode 4 controls against the SMS fixture
        run: >-
          make -C tests check-mode4
          CORE=../genesis_plus_gx_libretro.so

      # #40: scroll lock y split de paleta en Mode 4. El core tiene que dibujar
      # los dos y DECIR que el segundo es raster (0x10E, journal).
      - name: Mode 4 raster effects are drawn and reported
        run: >-
          make -C tests check-mode4-raster
          CORE=../genesis_plus_gx_libretro.so

      # #74: Mode 4 leido por el 68000. Los dos pasos de arriba entran a
      # Mode 4 con codigo Z80 en un cartucho de Master System; el VDP de
      # Mega Drive tambien entra en Mode 4 y esa funcion no la recorria
      # ningun fixture, asi que el arreglo de upstream (29ba0a88) habria
      # entrado sin que nada lo notara.
      - name: Mode 4 VRAM reads from the 68k
        run: >-
          make -C tests check-mode4-68k-vram
          CORE=../genesis_plus_gx_libretro.so

      # #98: el boot ROM del TMSS, con un boot ROM sintetico de 2KB. Lee los
      # bordes del banco de 64KB que upstream 774e360a expandio y le pasa el
      # control al cartucho.
      - name: TMSS boot ROM bank is expanded and hands over to the cartridge
        run: >-
          make -C tests check-tmss-bootrom
          CORE=../genesis_plus_gx_libretro.so

      # #117: el probe de ROMs comerciales (validate-roms) tiene un camino con
      # checkpoint -serializar a mitad de partida, seguir, restaurar y volver a
      # correr la misma continuacion- que aca corre con el ROM sintetico de FM:
      # video y audio de la continuacion restaurada tienen que dar la misma
      # huella frame a frame. Sin esto el probe solo se compilaba en CI.
      - name: ROM probe with a synthetic ROM and a mid-run checkpoint
        run: >-
          make -C tests check-rom-probe
          CORE=../genesis_plus_gx_libretro.so

      # #121: el bloque ATIM (#118) en tres casos: estado actual (continuidad
      # exacta), estado sin bloque (acepta, corre, determinista) y un estado
      # REAL guardado por el binario de ayther-abi-1.10-r2 (fixture disperso en
      # tests/ayther/golden, con su procedencia al lado).
      - name: Savestates with, without and predating the ATIM block
        run: >-
          make -C tests check-state-atim-compat
          CORE=../genesis_plus_gx_libretro.so

      # #98: accesos de palabra impares y al borde del banco, con address
      # error apagado: donde las mascaras `& 0xfffe` de upstream hacen algo.
      - name: Odd word accesses return the even word next door
        run: >-
          make -C tests check-odd-word-access
          CORE=../genesis_plus_gx_libretro.so

      - name: Per-scanline state matches the ROM's own scroll table
        run: >-
          make -C tests check-line-state
          CC=clang
          CORE=../genesis_plus_gx_libretro.so

      # #35: un hash por modo de video. El fixture determinista cubre Mode 5
      # H40 progresivo NTSC y nada mas; estas ocho escenas cubren H32, window,
      # shadow/highlight, los dos interlaces, PAL y DMA fill. Un golden POR
      # ESCENA es lo que convierte "algo se rompio" en "se rompio el interlace".
      - name: Video modes match their per-scene golden
        run: >-
          make -C tests check-scenes
          CC=clang
          CORE=../genesis_plus_gx_libretro.so

      # El core de metricas queda en el arbol; los pasos que siguen necesitan el
      # normal de vuelta.
      - name: Rebuild the telemetry core
        env:
          CC: clang
          CXX: clang++
        run: >-
          make -B -f Makefile.libretro platform=unix
          AYTHER_EXTENSIONS=1 SOUND_PROBE=1 -j2

      # El numero se publica pero NO bloquea. Evidencia: dos corridas PARALELAS
      # del mismo commit midieron 1,023% y 1,708% -0,7 puntos de spread sobre
      # binarios identicos-, o sea que el ruido del runner compartido es mayor
      # que el propio umbral de 1%. Un gate asi no mide el codigo, mide en que
      # maquina toco correr, y su unico efecto es ensenar a ignorar el rojo.
      # La medicion sigue siendo util como serie temporal. Ver #35.
      - name: Measure compiled-idle overhead (informative)
        continue-on-error: true
        run: >-
          make -C tests check-profile-comparison
          CC=clang
          PROFILE_OFF_CORE=artifacts/profiles/extensions-off.so
          PROFILE_IDLE_CORE=artifacts/profiles/compiled-idle.so

      # #35: mismos dos cores, pero esto SI bloquea. Un estado de un perfil
      # tiene que cargar en el otro y seguir igual; el modo de falla que se
      # busca es el que carga "bien" y diverge despues.
      - name: A savestate crosses profiles without diverging
        run: >-
          make -C tests check-state-cross-profile
          CC=clang
          PROFILE_OFF_CORE=artifacts/profiles/extensions-off.so
          PROFILE_IDLE_CORE=artifacts/profiles/compiled-idle.so

      - name: Run audio_probe performance baseline
        run: make -C bench run CC=clang

      - name: Upload deterministic and benchmark reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ayther-linux-reports
          path: |
            tests/artifacts/
            bench/artifacts/
          if-no-files-found: error
          retention-days: 30

  sanitizers:
    name: ASan and UBSan
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run isolated tests under ASan and UBSan
        run: >-
          make -C tests check
          CC=clang
          BUILD_DIR=.build/sanitize
          ARTIFACT_DIR=artifacts/sanitize
          CFLAGS="-O1 -g -Wall -Wextra -fsanitize=address,undefined -fno-omit-frame-pointer"
          LDFLAGS="-fsanitize=address,undefined"

      - name: Upload sanitizer trace on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ayther-sanitizer-diagnostics
          path: tests/artifacts/sanitize/
          if-no-files-found: ignore
          retention-days: 14

  full-core-sanitize:
    name: Full core under UBSan (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # #38: hasta aca los sanitizers solo cubrian los binarios construidos
      # contra tests/stub, o sea todo menos vdp_render.c, vdp_ctrl.c, ym2612.c y
      # libretro.c, que es donde vive el fork. El unico test que los ejercita
      # -full_core_replay- nunca corria instrumentado.
      # UBSan y no ASan: el core se construye como .so con -Wl,--no-undefined, y
      # el runtime de ASan no se linkea en una biblioteca compartida -se espera
      # en el ejecutable que la carga-, asi que quedan undefined references a
      # __asan_report_*. Hacerlo andar exigiria construir tambien el harness con
      # ASan y precargar el runtime. UBSan si se puede linkear adentro con
      # -static-libsan, y es el que encontro los hallazgos de #38.
      # ASan sobre el core completo queda pendiente en #45.
      # -shared-libsan y no -static-libsan: clang NO linkea el runtime del
      # sanitizer dentro de una biblioteca compartida -da por sentado que lo
      # aporta el ejecutable-, asi que con el estatico quedan undefined
      # references a __ubsan_handle_*. Con el compartido la .so queda con un
      # DT_NEEDED al runtime y resuelve.
      - name: Build the core with UBSan
        env:
          CC: clang
          CXX: clang++
        run: >-
          make -B -f Makefile.libretro platform=unix
          SOUND_PROBE=1
          CC="clang -fsanitize=undefined -shared-libsan -fno-omit-frame-pointer -g"
          -j2

      # El harness tambien: es quien hace dlopen del core, y asi el runtime ya
      # esta cargado e inicializado cuando entra la biblioteca.
      - name: Build the replay harness with UBSan
        run: >-
          make -C tests full-core-replay CC=clang
          CFLAGS="-O1 -g -Wall -Wextra -fsanitize=undefined -shared-libsan -fno-omit-frame-pointer"
          LDFLAGS="-fsanitize=undefined -shared-libsan"

      # El veredicto lo da tests/ci/run_sanitizers.sh contra known_ub.txt.
      # Desde #101 esa lista esta VACIA, asi que el gate ya no dice "sin UB
      # nuevo" sino SIN UB: cualquier reporte pone el job en rojo. Apagar
      # -fsanitize=alignment para tapar algo taparia tambien lo que venga.
      - name: Run the full-core replay under UBSan
        run: |
          # El runtime compartido vive en el directorio de clang, que no esta en
          # el path del loader por defecto.
          export LD_LIBRARY_PATH="$(clang -print-runtime-dir):${LD_LIBRARY_PATH:-}"
          bash tests/ci/run_sanitizers.sh "$(pwd)/genesis_plus_gx_libretro.so"

      - name: Upload sanitizer diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ayther-full-core-sanitize
          path: tests/artifacts/
          if-no-files-found: ignore
          retention-days: 14

  # #99: `check-fuzz` -- el corpus y las regresiones, reproducidos-- tiene que
  # correr en CADA PR, y contra un core INSTRUMENTADO.
  #
  # Las dos mitades de esa frase costaron una medicion cada una.
  #
  # Que no corria: hasta #99 este workflow no lo nombraba ni una vez. El unico
  # lugar donde corria era el job `regressions` del nocturno, asi que un caso
  # agregado a `tests/fuzz/regressions/` -- que es el mecanismo que existe para
  # que un bug encontrado por fuzzing no vuelva-- no bloqueaba el merge que lo
  # reintroducia: lo agarraba el cron hasta 24 h despues, sobre master y sin PR
  # al cual atribuirlo. Y el nocturno afirmaba en dos lugares que si corria.
  #
  # Que sin sanitizers no sirve: se midio sacando a mano `SLOT->ksr &= 31;` de
  # core/sound/ym2612.c, el arreglo que cubre la regresion
  # `unserialize/ksr-corrupto-indexa-eg-rate-shift-83`.
  #
  #     core normal  con el clamp: exit 0   sin el clamp: exit 0   <- no muerde
  #     core ASan    con el clamp: exit 0   sin el clamp: exit 2
  #
  # Sin instrumentar, el indice podrido lee fuera de `eg_rate_shift[]` y cae en
  # memoria que esta al lado: el replay pasa como si nada. Es el mismo modo de
  # falla del hallazgo de #63, que caia en `dma_timing`.
  #
  # Es deterministico -- reproduce un corpus fijo-- asi que correrlo por PR es
  # estrictamente mejor que por cron. El nocturno se queda con los jobs de
  # BUSQUEDA, que son los que de verdad necesitan tiempo de reloj.
  # #101: UBSan en arm64, que es lo que nunca se habia corrido.
  #
  # Las tres excepciones de known_ub.txt decian "hoy no rompe ninguna plataforma
  # soportada" y su condicion de salida era "cuando macOS arm64 entre al matrix".
  # arm64 entro en ed2441d3 -- y nadie volvio a mirar--, pero ademas la frase
  # estaba medida SOLO en x86-64: los tres jobs que corren sanitizers son
  # ubuntu-latest. Justo la plataforma donde un acceso desalineado no molesta.
  #
  # Este job es el que hace verdadera la frase. Corre el mismo run_sanitizers.sh
  # que la version de Linux, con el mismo golden unico (#45), contra el core de
  # arm64.
  #
  # UBSan y no ASan, por lo mismo que el job de Linux: el core es una biblioteca
  # compartida y el runtime de ASan se espera en el ejecutable que la carga.
  # UBSan se linkea adentro con -shared-libsan y alcanza de sobra para lo que se
  # quiere medir aca, que es alineacion.
  macos-sanitize:
    name: Full core under UBSan (macOS arm64)
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build the core with UBSan
        run: >-
          make -B -f Makefile.libretro platform=osx
          SOUND_PROBE=1
          CC="clang -fsanitize=undefined -shared-libsan -fno-omit-frame-pointer -g"
          -j3

      # El harness tambien, por la misma razon que en Linux: es quien hace
      # dlopen del core, asi el runtime ya esta cargado cuando entra la libreria.
      - name: Build the replay harness with UBSan
        run: >-
          make -C tests full-core-replay CC=clang
          CFLAGS="-O1 -g -Wall -Wextra -fsanitize=undefined -shared-libsan -fno-omit-frame-pointer"
          LDFLAGS="-fsanitize=undefined -shared-libsan"

      - name: Run the full-core replay under UBSan
        run: |
          set -euo pipefail
          # En Darwin el loader usa DYLD_LIBRARY_PATH, no LD_LIBRARY_PATH, y el
          # runtime compartido vive en el directorio de clang.
          export DYLD_LIBRARY_PATH="$(clang -print-runtime-dir):${DYLD_LIBRARY_PATH:-}"
          bash tests/ci/run_sanitizers.sh "$(pwd)/genesis_plus_gx_libretro.dylib"

      - name: Upload sanitizer diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ayther-macos-sanitize
          path: tests/artifacts/
          if-no-files-found: ignore
          retention-days: 14

  fuzz-regressions:
    name: Fuzz corpus and regressions under ASan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build the core with sanitizers
        env:
          CC: clang
        run: >-
          make -B -f Makefile.libretro platform=unix
          AYTHER_EXTENSIONS=1 SOUND_PROBE=1
          CC="clang -fsanitize=address,undefined -shared-libsan -fno-omit-frame-pointer -g"
          -j2

      # Los harnesses van con el MISMO runtime dinamico que el core (#61): con
      # el estatico conviven dos runtimes de ASan en el proceso y muere antes
      # del primer caso. `verify_asan_link_order=0` es la alternativa al
      # LD_PRELOAD del Makefile de fuzz: el runtime ya esta linkeado en el
      # ejecutable, solo hay que decirle a ASan que no exija ser el primero.
      #
      # `halt_on_error=0` (#107): ASan aborta solo, pero UBSan con este flag
      # IMPRIME Y SIGUE, asi que un indice fuera de rango o un shift invalido
      # dejaba el proceso en exit 0 y el job en verde. El flag se queda -- una
      # corrida deja el inventario completo en vez del primer caso, igual que en
      # run_sanitizers.sh y en el nocturno--, pero el veredicto ya no lo da el
      # codigo de salida: lo da filter_known_ub.sh sobre el log, mas abajo. Por
      # eso el `tee` no es cosmetico: el log ES la evidencia que se juzga.
      - name: Replay the fuzz corpus and regressions under ASan
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=0:report_error_type=1
          ASAN_OPTIONS: verify_asan_link_order=0
          REPLAY_SAN: -fsanitize=address,undefined -shared-libsan -fno-omit-frame-pointer
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$(clang -print-runtime-dir):${LD_LIBRARY_PATH:-}"
          make -C tests check-fuzz CC=clang CORE=../genesis_plus_gx_libretro.so \
            2>&1 | tee fuzz-replay.log

      # #108: el aislamiento de las entradas de `unserialize`, medido y no
      # declarado. El target decia restaurar "un estado sano" entre entradas y
      # restauraba el estado actual, ya podrido: dos veces (#63, #105) el
      # crash-* del nocturno no reproducia solo por eso. Este paso afirma que
      # cada entrada da la MISMA huella sola, repetida, y detras de las demas
      # en orden directo e inverso. Usa el replay que acaba de compilar el
      # paso de arriba y el mismo core; su stderr va a un log POR ESCENA que
      # se juzga con el filtro, mas abajo, igual que los otros.
      #
      # #116: en las CUATRO escenas, no solo en `md`. Lo que se restaura entre
      # entradas es el estado inicial de la escena, y ese estado es distinto
      # en cada una (el bloque del CD en `scd`, el YM2413 en `sms-fm`, el
      # Nuked en `md-nuked`): que `md` aisle no decia nada de las otras tres,
      # que el corpus reproduce igual. La lista de escenas es explicita y la
      # afirma por nombre el paso "Every fuzz target and unserialize scene
      # was replayed", mas abajo, para que no pueda encogerse en silencio.
      - name: Each unserialize entry gives the same result alone, repeated and after the others, in every scene
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=0:report_error_type=1
          ASAN_OPTIONS: verify_asan_link_order=0
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$(clang -print-runtime-dir):${LD_LIBRARY_PATH:-}"
          rc=0
          for scene in md md-nuked sms-fm scd; do
            bash tests/ci/check_fuzz_isolation.sh genesis_plus_gx_libretro.so "$scene" "fuzz-isolation-$scene.log" \
              2>&1 | tee "fuzz-isolation-$scene.out" || rc=1
          done
          exit "$rc"

      # El gate no puede encogerse en silencio. `check-fuzz` sale de un fan-out
      # sobre TARGETS y SCENES_unserialize (tests/fuzz/Makefile): si alguien
      # saca un target o una escena, la CI se pondria MAS VERDE y nadie se
      # enteraria, porque lo que quedo sigue pasando. Por eso la lista esperada
      # se afirma POR NOMBRE aca y no se deduce de la corrida.
      #
      # Agregar un target es legitimo y hace fallar este paso una vez: se suma
      # a la lista en el mismo PR, que es el mismo trato que reciben los
      # goldens y la linea base de puntos de contacto.
      - name: Every fuzz target and unserialize scene was replayed
        run: |
          set -euo pipefail
          esperados=$(printf '%s\n' \
            'audio_ring [escena md]' \
            'generated_rom [escena md]' \
            'recompose [escena md]' \
            'unserialize [escena md-nuked]' \
            'unserialize [escena md]' \
            'unserialize [escena scd]' \
            'unserialize [escena sms-fm]' \
            'write_control [escena md]' | sort)
          corridos=$(sed -n 's/^== \(.*\) ==$/\1/p' fuzz-replay.log | sort -u)
          if [ "$esperados" != "$corridos" ]; then
            echo "La cobertura de check-fuzz cambio." >&2
            echo "--- esperados ---" >&2; echo "$esperados" >&2
            echo "--- corridos  ---" >&2; echo "$corridos" >&2
            echo >&2
            echo "Si agregaste un target o una escena, sumalo a la lista de este paso" >&2
            echo "en el mismo PR. Si desaparecio uno, el gate se achico: deci por que." >&2
            exit 1
          fi
          echo "check-fuzz: 5 targets, 4 escenas de unserialize, 8 invocaciones"

          # #116: el aislamiento tambien, por nombre. Un veredicto por escena,
          # en la ultima linea de cada .out, y las cuatro escenas presentes.
          esperados_iso=$(printf '%s\n' md md-nuked sms-fm scd | sort)
          corridos_iso=$(cat fuzz-isolation-*.out 2>/dev/null |
            sed -n 's/^aislamiento de unserialize \[\(.*\)\]: [0-9]* comprobaciones, 0 fallas$/\1/p' | sort -u)
          if [ "$esperados_iso" != "$corridos_iso" ]; then
            echo "El aislamiento de unserialize no se midio en las cuatro escenas." >&2
            echo "--- esperadas ---" >&2; echo "$esperados_iso" >&2
            echo "--- con veredicto 0 fallas ---" >&2; echo "$corridos_iso" >&2
            exit 1
          fi
          echo "aislamiento de unserialize: 4 escenas, 20 comprobaciones cada una"

      # Viajo junto con check-fuzz desde el nocturno, y por el mismo motivo:
      # check-z80-vdp-fifo SI corria en cada PR, pero contra un core sin
      # instrumentar, donde el bucle de slots del FIFO se salia de la tabla y
      # caia en `dma_timing`, que esta al lado, sin que el core se inmutara.
      # Ese es el hallazgo de #63. Aca corre contra el mismo core con ASan.
      - name: Z80/VDP fixture under ASan
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=0:report_error_type=1
          ASAN_OPTIONS: verify_asan_link_order=0
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$(clang -print-runtime-dir):${LD_LIBRARY_PATH:-}"
          make -C tests check-z80-vdp-fifo CC=clang \
            CFLAGS="-O1 -g -Wall -Wextra -fsanitize=address,undefined -shared-libsan -fno-omit-frame-pointer" \
            LDFLAGS="-fsanitize=address,undefined -shared-libsan" \
            CORE=../genesis_plus_gx_libretro.so \
            2>&1 | tee z80-vdp-fifo.log

      # #98: los dos fixtures que existen por arreglos de UB de upstream, con
      # la lupa puesta, que es donde se ven: sin la expansion del boot ROM
      # (774e360a) la ultima palabra del banco cae 62KB fuera del buffer, y
      # con las mascaras `& 0xffff` viejas (3d948cab, 7b74da34, f9caf203)
      # cada acceso impar es un reporte. Sin sanitizer solo se ve el valor
      # equivocado; con el, la causa.
      - name: TMSS boot ROM, odd word accesses and the ROM probe checkpoint under ASan
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=0:report_error_type=1
          ASAN_OPTIONS: verify_asan_link_order=0
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$(clang -print-runtime-dir):${LD_LIBRARY_PATH:-}"
          make -C tests check-tmss-bootrom check-odd-word-access check-rom-probe check-state-atim-compat CC=clang \
            CFLAGS="-O1 -g -Wall -Wextra -fsanitize=address,undefined -shared-libsan -fno-omit-frame-pointer" \
            LDFLAGS="-fsanitize=address,undefined -shared-libsan" \
            CORE=../genesis_plus_gx_libretro.so \
            2>&1 | tee odd-access.log

      # El veredicto de UBSan (#107). Hasta aca los dos pasos de arriba solo
      # fallaban si ASan abortaba o si un assert del harness saltaba; todo lo
      # que UBSan reporta con halt_on_error=0 quedaba en el log y nadie lo
      # miraba. Medido en la revision de #106, con master antes de #102: el
      # replay de la regresion de zbank salia exit 0 con 16 reportes de `store
      # to misaligned address` en el log. Ese UB ya no esta, pero el proximo
      # habria pasado igual.
      #
      # Es el mismo filtro que juzga run_sanitizers.sh y el nocturno, contra
      # la misma known_ub.txt -- vacia desde #101, asi que "sin UB" a secas--,
      # y se aplica a los DOS logs: el del corpus y el del fixture. Un paso
      # aparte y no un `&&` al final de cada uno, para que el log exista
      # entero cuando se juzga y para que la razon del rojo se lea sola.
      - name: Reject any sanitizer report in the replay logs
        run: |
          set -euo pipefail
          echo "== fuzz-replay.log =="
          bash tests/ci/filter_known_ub.sh fuzz-replay.log
          echo "== z80-vdp-fifo.log =="
          bash tests/ci/filter_known_ub.sh z80-vdp-fifo.log
          for scene in md md-nuked sms-fm scd; do
            echo "== fuzz-isolation-$scene.log =="
            bash tests/ci/filter_known_ub.sh "fuzz-isolation-$scene.log"
          done
          echo "== odd-access.log =="
          bash tests/ci/filter_known_ub.sh odd-access.log

      # Los dos logs se suben pase lo que pase: cuando el paso de arriba pone
      # el job en rojo, el reporte completo -con stack trace- esta aca y no
      # solo el resumen por sitio que imprime el filtro.
      - name: Upload the replay and fixture logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ayther-fuzz-regressions
          path: |
            fuzz-replay.log
            z80-vdp-fifo.log
            fuzz-isolation-*.log
            fuzz-isolation-*.out
            odd-access.log
          if-no-files-found: ignore
          retention-days: 14

  thread-sanitizer:
    name: ThreadSanitizer SPSC stress
    runs-on: ubuntu-latest
    env:
      TSAN_OPTIONS: halt_on_error=1:history_size=7
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run concurrent producer/consumer stress under ThreadSanitizer
        run: >-
          make -C tests check-concurrency
          CC=clang
          BUILD_DIR=.build/tsan
          CFLAGS="-O1 -g -Wall -Wextra -fsanitize=thread -fno-omit-frame-pointer"
          LDFLAGS="-fsanitize=thread"

  windows-msvcrt:
    name: Windows x64 MSVCRT (extensions=${{ matrix.ayther_extensions }}, probe=${{ matrix.sound_probe }}, legacy=${{ matrix.legacy_profile }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ayther_extensions: 0
            sound_probe: 0
            legacy_profile: 0
          - ayther_extensions: 1
            sound_probe: 0
            legacy_profile: 0
          - ayther_extensions: 1
            sound_probe: 1
            legacy_profile: 0
          - ayther_extensions: 1
            sound_probe: 1
            legacy_profile: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned llvm-mingw MSVCRT toolchain
        shell: pwsh
        run: >-
          ./.github/scripts/setup-llvm-mingw.ps1
          -Version $env:LLVM_MINGW_VERSION
          -Sha256 $env:LLVM_MINGW_SHA256

      - name: Build libretro core
        shell: pwsh
        run: >-
          make -f Makefile.libretro platform=win64
          AYTHER_EXTENSIONS=${{ matrix.ayther_extensions }}
          AYTHER_LEGACY_PROFILE=${{ matrix.legacy_profile }}
          SOUND_PROBE=${{ matrix.sound_probe }} -j2

      - name: Verify PE runtime, loadability and exports
        shell: pwsh
        run: >-
          ./.github/scripts/verify-windows-core.ps1
          -DllPath genesis_plus_gx_libretro.dll
          -AytherExtensions ${{ matrix.ayther_extensions }}
          -LegacyProfile ${{ matrix.legacy_profile }}
          -SoundProbe ${{ matrix.sound_probe }}

      - name: Run Windows deterministic tests
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        shell: pwsh
        run: make -C tests check CC=clang

      # #114: la deteccion de shell tambien se prueba ACA, porque el caso que
      # fallaba solo existe en Windows: sin sh.exe en el PATH, make informa
      # `$(SHELL) = sh.exe` y ejecuta cmd. El job de Linux corre la tabla; este
      # corre ademas make_dir y require_core con el PATH sin ningun sh.
      # `shell: bash` y no `bash` desde pwsh: en una maquina con WSL, `bash` a
      # secas desde PowerShell puede ser el de WSL (uname Linux) y el caso se
      # salta solo. GitHub resuelve `shell: bash` al de Git for Windows.
      - name: The shell detection survives a PATH without sh.exe
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        shell: bash
        run: bash tests/ci/check_shell_detection.sh

      - name: Replay generated ROM across save/load boundary
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        shell: pwsh
        run: >-
          make -C tests check-full-core
          CC=clang
          CORE=../genesis_plus_gx_libretro.dll

      - name: Reject a savestate written by a different ABI
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        shell: pwsh
        run: >-
          make -C tests check-state-guard
          CC=clang
          CORE=../genesis_plus_gx_libretro.dll

      - name: Reject a Sega CD savestate with an invalid track index
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        shell: pwsh
        run: >-
          make -C tests check-state-scd-guard
          CC=clang
          CORE=../genesis_plus_gx_libretro.dll

      - name: Report serialized struct layout
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        shell: pwsh
        run: make -C tests state-layout CC=clang

      - name: Audio controls reach every FM core
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        shell: pwsh
        run: >-
          make -C tests check-audio-controls
          CC=clang
          CORE=../genesis_plus_gx_libretro.dll

      # #75: el savestate de SMS con Nuked tiene que cargar en un PROCESO
      # nuevo y dar lo mismo que en el mismo proceso. Es lo unico que agarra
      # un puntero serializado: dentro de una sola sesion la direccion sigue
      # siendo valida y no falla nada.
      - name: SMS savestate with Nuked FM survives a new process
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        shell: pwsh
        run: >-
          make -C tests check-state-cross-process
          CC=clang
          CORE=../genesis_plus_gx_libretro.dll

      # #76: el savestate tiene que estar COMPLETO. Guardar, correr, recargar,
      # correr lo mismo y comparar; sin golden, el oraculo es la corrida de al
      # lado. Sobre Mega Drive, Master System, SMS con FM Nuked y Game Gear.
      - name: Savestate roundtrip is complete on every system
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        shell: pwsh
        run: >-
          make -C tests check-state-roundtrip
          CC=clang
          CORE=../genesis_plus_gx_libretro.dll

      - name: Frame delta survives a second reader
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        shell: pwsh
        run: >-
          make -C tests check-frame-delta
          CC=clang
          CORE=../genesis_plus_gx_libretro.dll

      - name: System descriptor names the frame it describes
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        shell: pwsh
        run: >-
          make -C tests check-system-transition
          CC=clang
          CORE=../genesis_plus_gx_libretro.dll

      - name: Z80 hammering the VDP data port keeps the core alive
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        shell: pwsh
        run: >-
          make -C tests check-z80-vdp-fifo
          CC=clang
          CORE=../genesis_plus_gx_libretro.dll

      - name: Mode 4 controls against the SMS fixture
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        shell: pwsh
        run: >-
          make -C tests check-mode4
          CC=clang
          CORE=../genesis_plus_gx_libretro.dll

      - name: Mode 4 raster effects are drawn and reported
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        shell: pwsh
        run: >-
          make -C tests check-mode4-raster
          CC=clang
          CORE=../genesis_plus_gx_libretro.dll

      # #74: Mode 4 leido por el 68000. Los dos pasos de arriba entran a
      # Mode 4 con codigo Z80 en un cartucho de Master System; el VDP de
      # Mega Drive tambien entra en Mode 4 y esa funcion no la recorria
      # ningun fixture, asi que el arreglo de upstream (29ba0a88) habria
      # entrado sin que nada lo notara.
      - name: Mode 4 VRAM reads from the 68k
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        shell: pwsh
        run: >-
          make -C tests check-mode4-68k-vram
          CC=clang
          CORE=../genesis_plus_gx_libretro.dll

      - name: TMSS boot ROM bank is expanded and hands over to the cartridge
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        shell: pwsh
        run: >-
          make -C tests check-tmss-bootrom
          CC=clang
          CORE=../genesis_plus_gx_libretro.dll

      # #117: ver el job de Linux.
      - name: ROM probe with a synthetic ROM and a mid-run checkpoint
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        shell: pwsh
        run: >-
          make -C tests check-rom-probe
          CC=clang
          CORE=../genesis_plus_gx_libretro.dll

      # #121: ver el job de Linux.
      - name: Savestates with, without and predating the ATIM block
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        shell: pwsh
        run: >-
          make -C tests check-state-atim-compat
          CC=clang
          CORE=../genesis_plus_gx_libretro.dll

      - name: Odd word accesses return the even word next door
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        shell: pwsh
        run: >-
          make -C tests check-odd-word-access
          CC=clang
          CORE=../genesis_plus_gx_libretro.dll

      - name: Compare extensions-off and compiled-idle profiles
        continue-on-error: true
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tests\artifacts\profiles | Out-Null
          Copy-Item genesis_plus_gx_libretro.dll tests\artifacts\profiles\compiled-idle.dll
          make -B -f Makefile.libretro platform=win64 AYTHER_EXTENSIONS=0 SOUND_PROBE=0 -j2
          Copy-Item genesis_plus_gx_libretro.dll tests\artifacts\profiles\extensions-off.dll
          make -C tests check-profile-comparison CC=clang PROFILE_OFF_CORE=artifacts/profiles/extensions-off.dll PROFILE_IDLE_CORE=artifacts/profiles/compiled-idle.dll

      - name: A savestate crosses profiles without diverging
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        shell: pwsh
        run: >-
          make -C tests check-state-cross-profile
          CC=clang
          PROFILE_OFF_CORE=artifacts/profiles/extensions-off.dll
          PROFILE_IDLE_CORE=artifacts/profiles/compiled-idle.dll

      - name: Capture Windows performance baseline
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        shell: pwsh
        run: make -C bench run CC=clang

      - name: Upload Windows reports
        if: always() && matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        uses: actions/upload-artifact@v7
        with:
          name: ayther-windows-msvcrt-reports
          path: |
            ayther-artifacts/
            tests/artifacts/
            bench/artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Preserve Windows diagnostics on matrix failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ayther-windows-msvcrt-extensions-${{ matrix.ayther_extensions }}-probe-${{ matrix.sound_probe }}-legacy-${{ matrix.legacy_profile }}-diagnostics
          path: ayther-artifacts/
          if-no-files-found: ignore
          retention-days: 14
  # #35 punto 2: macOS en CI.
  #
  # No es "una plataforma mas". Los runners de macOS son arm64, asi que este
  # job es lo unico que corre los goldens fuera de x86-64, y es la unica
  # forma de saber si el fixture generado y las tablas del VDP dependen de la
  # arquitectura o solo del endianness. Si un golden se mueve aca, lo que hay
  # que mirar es el golden, no el job.
  #
  # Lo que este job NO hace, a proposito: el cierre de exports. `check_exports.sh`
  # lee simbolos con nm/objdump al estilo ELF/PE, y en Mach-O los simbolos llevan
  # un guion bajo delante. Correrlo aca sin adaptarlo daria un verde que no
  # verifica nada, que es peor que no correrlo.
  macos-core:
    name: macOS arm64 (extensions=${{ matrix.ayther_extensions }}, probe=${{ matrix.sound_probe }}, legacy=${{ matrix.legacy_profile }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ayther_extensions: 0
            sound_probe: 0
            legacy_profile: 0
          - ayther_extensions: 1
            sound_probe: 0
            legacy_profile: 0
          - ayther_extensions: 1
            sound_probe: 1
            legacy_profile: 0
          - ayther_extensions: 1
            sound_probe: 1
            legacy_profile: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build libretro core
        run: >-
          make -f Makefile.libretro platform=osx
          AYTHER_EXTENSIONS=${{ matrix.ayther_extensions }}
          AYTHER_LEGACY_PROFILE=${{ matrix.legacy_profile }}
          SOUND_PROBE=${{ matrix.sound_probe }} -j3

      - name: Report the built dylib
        run: |
          set -euo pipefail
          test -f genesis_plus_gx_libretro.dylib
          file genesis_plus_gx_libretro.dylib
          otool -L genesis_plus_gx_libretro.dylib

      - name: Run unit and golden-trace tests
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        run: make -C tests check

      - name: Replay generated ROM across save/load boundary
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        run: >-
          make -C tests check-full-core
          CORE=../genesis_plus_gx_libretro.dylib

      - name: Reject a savestate written by a different ABI
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        run: >-
          make -C tests check-state-guard
          CORE=../genesis_plus_gx_libretro.dylib

      - name: Reject a Sega CD savestate with an invalid track index
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        run: >-
          make -C tests check-state-scd-guard
          CORE=../genesis_plus_gx_libretro.dylib

      - name: Report serialized struct layout
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        run: make -C tests state-layout

      - name: Audio controls reach every FM core
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        run: >-
          make -C tests check-audio-controls
          CORE=../genesis_plus_gx_libretro.dylib

      # #75: el savestate de SMS con Nuked tiene que cargar en un PROCESO
      # nuevo y dar lo mismo que en el mismo proceso. Es lo unico que agarra
      # un puntero serializado: dentro de una sola sesion la direccion sigue
      # siendo valida y no falla nada.
      - name: SMS savestate with Nuked FM survives a new process
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        run: >-
          make -C tests check-state-cross-process
          CORE=../genesis_plus_gx_libretro.dylib

      # #76: el savestate tiene que estar COMPLETO. Guardar, correr, recargar,
      # correr lo mismo y comparar; sin golden, el oraculo es la corrida de al
      # lado. Sobre Mega Drive, Master System, SMS con FM Nuked y Game Gear.
      - name: Savestate roundtrip is complete on every system
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        run: >-
          make -C tests check-state-roundtrip
          CORE=../genesis_plus_gx_libretro.dylib

      - name: Frame delta survives a second reader
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        run: >-
          make -C tests check-frame-delta
          CORE=../genesis_plus_gx_libretro.dylib

      - name: System descriptor names the frame it describes
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        run: >-
          make -C tests check-system-transition
          CORE=../genesis_plus_gx_libretro.dylib

      - name: Z80 hammering the VDP data port keeps the core alive
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        run: >-
          make -C tests check-z80-vdp-fifo
          CORE=../genesis_plus_gx_libretro.dylib

      - name: Attribution answers a subscription that asks only for it
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        run: >-
          make -C tests check-attribution-scene
          CORE=../genesis_plus_gx_libretro.dylib

      - name: Plane tile suppression hides one plane at a time
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        run: >-
          make -C tests check-plane-suppress
          CORE=../genesis_plus_gx_libretro.dylib

      - name: The five recomposition layers match their golden
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        run: >-
          make -C tests check-multilayer
          CORE=../genesis_plus_gx_libretro.dylib

      - name: Mode 4 controls against the SMS fixture
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        run: >-
          make -C tests check-mode4
          CORE=../genesis_plus_gx_libretro.dylib

      - name: Mode 4 raster effects are drawn and reported
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        run: >-
          make -C tests check-mode4-raster
          CORE=../genesis_plus_gx_libretro.dylib

      # #74: Mode 4 leido por el 68000. Los dos pasos de arriba entran a
      # Mode 4 con codigo Z80 en un cartucho de Master System; el VDP de
      # Mega Drive tambien entra en Mode 4 y esa funcion no la recorria
      # ningun fixture, asi que el arreglo de upstream (29ba0a88) habria
      # entrado sin que nada lo notara.
      - name: Mode 4 VRAM reads from the 68k
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        run: >-
          make -C tests check-mode4-68k-vram
          CORE=../genesis_plus_gx_libretro.dylib

      - name: TMSS boot ROM bank is expanded and hands over to the cartridge
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        run: >-
          make -C tests check-tmss-bootrom
          CORE=../genesis_plus_gx_libretro.dylib

      # #117: ver el job de Linux.
      - name: ROM probe with a synthetic ROM and a mid-run checkpoint
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        run: >-
          make -C tests check-rom-probe
          CORE=../genesis_plus_gx_libretro.dylib

      # #121: ver el job de Linux. macOS arm64 tiene un TERCER layout de
      # savestate (0x2419d61a; Windows x64 0x7e56354f, Linux x64 0x670dec82) y
      # el release no publica binarios de macOS, asi que el estado "de r2" no
      # puede venir del repo: se construye el commit de r2 (9e8b6bc6) aca mismo
      # y se vuelca el fixture con --dump-sparse justo antes del check. Los dos
      # fixtures del repo se pasan igual: el harness los descarta por layout, y
      # ese descarte es parte de lo que se afirma.
      - name: Savestates with, without and predating the ATIM block
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 9e8b6bc6
          git worktree add ../gpgx-r2 9e8b6bc6
          make -C ../gpgx-r2 -f Makefile.libretro platform=osx AYTHER_EXTENSIONS=1 SOUND_PROBE=1 -j3
          make -C tests .build/state_atim_compat
          tests/.build/state_atim_compat --dump-sparse ../gpgx-r2/genesis_plus_gx_libretro.dylib tests/.build/state-md-fm-busy-1.10-r2-macos.sparse
          make -C tests check-state-atim-compat CORE=../genesis_plus_gx_libretro.dylib ATIM_FIXTURES="ayther/golden/state-md-fm-busy-1.10-r2-win64.sparse ayther/golden/state-md-fm-busy-1.10-r2-lp64.sparse .build/state-md-fm-busy-1.10-r2-macos.sparse"

      - name: Odd word accesses return the even word next door
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        run: >-
          make -C tests check-odd-word-access
          CORE=../genesis_plus_gx_libretro.dylib

      - name: Journal, frame hashes and resolved palette
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        run: >-
          make -C tests check-observability
          CORE=../genesis_plus_gx_libretro.dylib

      - name: Per-scanline state matches the ROM's own scroll table
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        run: >-
          make -C tests check-line-state
          CORE=../genesis_plus_gx_libretro.dylib

      - name: Video modes match their per-scene golden
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        run: >-
          make -C tests check-scenes
          CORE=../genesis_plus_gx_libretro.dylib

      - name: Build a metrics core
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        run: >-
          make -B -f Makefile.libretro platform=osx
          AYTHER_EXTENSIONS=1 SOUND_PROBE=1 AYTHER_METRICS=1 -j3

      - name: Idle does exactly zero work
        if: matrix.ayther_extensions == 1 && matrix.sound_probe == 1 && matrix.legacy_profile == 0
        run: >-
          make -C tests check-idle-metrics
          CORE=../genesis_plus_gx_libretro.dylib

      - name: Preserve macOS diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ayther-macos-extensions-${{ matrix.ayther_extensions }}-probe-${{ matrix.sound_probe }}-legacy-${{ matrix.legacy_profile }}-diagnostics
          path: |
            ayther-artifacts/
            tests/artifacts/
          if-no-files-found: ignore
          retention-days: 14
  # #43 punto 5: LTO. El issue pedia un job que compile con -flto y compare, y
  # que se adopte si mejora >= 3% sin romper goldens. Medido en Linux/gcc:
  #
  #   sin LTO   .so 12.917.992   .text 1.211.647
  #   con LTO   .so 11.224.584   .text 1.267.191
  #
  # El .so total baja 13%, pero eso es casi todo simbolos y debug, que no se
  # cargan. Lo que corre -- .text-- CRECE 4,6%: LTO inlinea entre unidades y la
  # presion sobre la i-cache sube. Sobre velocidad no se puede decidir con este
  # harness: el bench tiene +-3% de ruido y el umbral del issue es exactamente
  # 3%, asi que cualquier veredicto seria ruido con forma de conclusion.
  #
  # Conclusion: NO se adopta por defecto. Queda como `AYTHER_LTO=1`, y este job
  # existe para que siga funcionando -- un build con LTO es donde aparece el UB
  # entre unidades- y para que los 14 clones fast/observed sigan separados: si
  # LTO los fusionara, el patron que sostiene el "cero costo en idle" se cae.
  lto-build:
    name: LTO build (opt-in, no adoptado)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build with and without LTO
        run: |
          set -euo pipefail
          make -B -f Makefile.libretro platform=unix AYTHER_EXTENSIONS=1 SOUND_PROBE=1 -j2
          cp genesis_plus_gx_libretro.so base.so
          make -B -f Makefile.libretro platform=unix AYTHER_EXTENSIONS=1 SOUND_PROBE=1 \
            AYTHER_LTO=1 -j2

      - name: Report both sizes
        run: |
          set -euo pipefail
          for f in base.so genesis_plus_gx_libretro.so; do
            printf '%-28s total=%-10s .text=%s\n' "$f" "$(stat -c%s "$f")" \
              "$(size -A "$f" | awk '$1==".text"{print $2}')"
          done

      # Lo que este job protege de verdad: que LTO no deshaga el patron
      # fast/observed. Son 7 pares; si aparecen menos, alguno se fusiono.
      - name: The fast/observed clones survive LTO
        run: |
          set -euo pipefail
          n=$(nm genesis_plus_gx_libretro.so | grep -cE '_(fast|observed)_path')
          echo "clones separados: $n"
          test "$n" -eq 14

      - name: Verify shared-library exports
        run: |
          set -euo pipefail
          nm -D --defined-only genesis_plus_gx_libretro.so | sed 's/.* //' > exports.txt
          bash tests/ci/check_exports.sh exports.txt 1 0 1

      - name: Goldens hold under LTO
        run: |
          set -euo pipefail
          make -C tests check
          for t in check-full-core check-scenes check-line-state check-determinism \
                   check-abi-dynamic check-multilayer check-observability; do
            make -C tests "$t" CORE=../genesis_plus_gx_libretro.so
          done
  # #45.A: el fallo con UCRT, reproducido y con nombre.
  #
  # #38 dejo la causa acotada pero no demostrada: el build UCRT muere con
  # STATUS_STACK_BUFFER_OVERRUN (0xC0000409), que NO es agotamiento de pila
  # -- eso es 0xC00000FD-- sino lo que produce `__fastfail`. En UCRT `abort()`
  # y el *invalid parameter handler* estan implementados sobre el, y MSVCRT no
  # tiene ese handler: no es que MSVCRT funcione, es que no valida.
  #
  # El problema para cerrarlo era que `__fastfail` mata el proceso sin pasar por
  # el filtro de excepciones, asi que sin depurador no quedaba ni un mensaje. El
  # harness ahora se engancha ANTES (tests/ci/ucrt_diag.h): si el fallo llega por
  # un parametro invalido, el log dice que funcion y que expresion.
  #
  # RESULTADO (2026-08-25): el build UCRT NO falla. Carga, corre el replay
  # completo y produce el MISMO golden que msvcrt, Linux y macOS
  # (video_hash 4d39e98fa62d8b4e), con exit 0 y sin que ninguno de los handlers
  # se dispare. El `__fastfail` que #38 observo ya no esta.
  #
  # Por eso el job nacio como diagnostico con `continue-on-error` y hoy es una
  # PUERTA: lo que empezo como "averiguar por que muere" termino en "no muere", y
  # lo unico que queda por cuidar es que no vuelva a morir. Un diagnostico que ya
  # dio su respuesta y se deja en modo informativo es un job que nadie lee.
  #
  # Los handlers de tests/ci/ucrt_diag.h siguen puestos: si alguna vez vuelve,
  # el log va a decir por que -- abort, parametro invalido o fastfail crudo-- en
  # vez de dejar un codigo de salida sin explicacion.
  windows-ucrt:
    name: Windows UCRT (#45.A)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the pinned llvm-mingw UCRT toolchain
        shell: pwsh
        run: >-
          ./.github/scripts/setup-llvm-mingw.ps1
          -Version $env:LLVM_MINGW_VERSION
          -Sha256 $env:LLVM_MINGW_UCRT_SHA256
          -Crt ucrt

      - name: Build the core with UCRT
        shell: pwsh
        run: >-
          make -f Makefile.libretro platform=win64
          AYTHER_EXTENSIONS=1 SOUND_PROBE=1 -j2

      # Un build UCRT de mingw NO importa ucrtbase.dll directamente: importa los
      # *API sets* (api-ms-win-crt-runtime-l1-1-0.dll y companiia), que es como
      # Windows expone la UCRT desde Windows 10. Buscar el nombre del DLL a secas
      # da un falso negativo, y este job lo encontro en su primera corrida.
      - name: Confirm it really links against the UCRT
        shell: pwsh
        run: |
          $out = & llvm-readobj --coff-imports genesis_plus_gx_libretro.dll |
                 Select-String -Pattern 'ucrtbase|api-ms-win-crt|msvcrt'
          $out
          if (-not ($out -match 'ucrtbase|api-ms-win-crt')) {
            throw 'este build no usa la UCRT: el diagnostico no aplica'
          }
          if ($out -match 'msvcrt\.dll') {
            throw 'este build importa msvcrt: el toolchain elegido no es el UCRT'
          }

      # El harness con los handlers puestos. Si el proceso muere igual, el codigo
      # de salida y el log dicen por donde: 3 = abort(), 4 = parametro invalido,
      # 0xC0000409 crudo = fastfail por otro camino.
      - name: Run the full replay under UCRT, with the handlers installed
        shell: pwsh
        run: |
          # El mismo target que usa el resto de CI: el harness necesita cinco
          # rutas de salida, no solo el core, y pasarselas a mano fue un error de
          # uso disfrazado de fallo del core en la primera corrida.
          make -C tests check-full-core CC=clang CPPFLAGS=-DAYTHER_UCRT_DIAG `
            CORE=../genesis_plus_gx_libretro.dll 2>&1 |
            Tee-Object -FilePath ucrt-replay.log
          $code = $LASTEXITCODE
          Write-Host "exit code: $code (0x$('{0:X8}' -f $code))"
          Write-Host "3 = abort(), 4 = parametro invalido, 0xC0000409 = fastfail crudo"
          "UCRT_EXIT=$code" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload the UCRT diagnosis
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ayther-ucrt-diagnosis
          path: |
            ucrt-replay.log
            genesis_plus_gx_libretro.dll
          if-no-files-found: warn
          retention-days: 30
